[tool.bumpversion]
current_version = "0.0.2"
commit = false
tag = false

[[tool.bumpversion.files]]
filename = ".github/actions/goreleaser-build/VERSION"
search = "{current_version}"
replace = "{new_version}"

[[tool.bumpversion.files]]
filename = ".github/actions/goreleaser-build/.bumpversion.toml"
search = 'current_version = "{current_version}"'
replace = 'current_version = "{new_version}"'
