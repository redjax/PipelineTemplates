---
name: "Docker Build and Publish"
description: "Build and optionally push Docker images using docker/build-push-action."
author: "redjax"

inputs:
  context:
    description: "Build context path passed to docker build"
    required: true
    default: "."

  dockerfile:
    description: "Path to Dockerfile relative to context"
    required: false
    default: "Dockerfile"

  image_name:
    description: "Image name (repository) without registry host"
    required: true

  tags:
    description: "Newline-separated list of tags (without registry prefix)"
    required: true

  push:
    description: "Whether to push images to the registry"
    required: false
    default: "true"

  platforms:
    description: "Comma-separated list of target platforms, e.g. linux/amd64,linux/arm64"
    required: false
    default: "linux/amd64"

  build_args:
    description: "Build args for docker build, newline-separated KEY=VALUE pairs"
    required: false
    default: ""

  cache_from:
    description: "Cache sources for docker build (docker/build-push-action cache-from)"
    required: false
    default: ""

  cache_to:
    description: "Cache destinations for docker build (docker/build-push-action cache-to)"
    required: false
    default: ""

  registry:
    description: "Registry hostname, e.g. ghcr.io"
    required: true

  registry_username:
    description: "Registry username"
    required: true

  registry_password:
    description: "Registry password / token"
    required: true

runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to registry
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry_username }}
        password: ${{ inputs.registry_password }}

    - name: Build and push image(s)
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        push: ${{ inputs.push }}
        platforms: ${{ inputs.platforms }}
        ## Prepend registry + image name to each tag line
        tags: ${{ inputs.tags }}
        build-args: ${{ inputs.build_args }}
        cache-from: ${{ inputs.cache_from }}
        cache-to: ${{ inputs.cache_to }}
