---
name: "Hugo Build Site"
description: "Build a Hugo site with optional caching and change detection."

inputs:
  hugo-version:
    description: "Hugo version to install (e.g. 0.161.1)."
    required: false
    default: "0.161.1"

  extended:
    description: "Use the extended Hugo binary (required for SCSS/SASS, etc.)."
    required: false
    default: "true"

  debug-state:
    description: "Debug build state"
    required: false
    default: "false"

  source-dir:
    description: "Path to the Hugo project root."
    required: false
    default: "."

  public-dir:
    description: "Output directory for the built site."
    required: false
    default: "public"

  base-url:
    description: "Optional base URL override. Leave empty to use site config."
    required: false
    default: ""

  environment:
    description: "Hugo environment (production, staging, etc.)."
    required: false
    default: "production"

  build-flags:
    description: "Extra flags passed to hugo."
    required: false
    default: "--gc --minify"

  use-cache:
    description: "Enable cache restore/save for Hugo-related build inputs."
    required: false
    default: "true"

  cache-key-suffix:
    description: "Optional suffix to differentiate caches."
    required: false
    default: ""

  check-changed:
    description: "If true, detect changed files and skip build when nothing relevant changed."
    required: false
    default: "false"

  changed-paths-mode:
    description: "default, replace, or append."
    required: false
    default: "default"

  changed-paths:
    description: "Newline-delimited glob patterns. Used when mode=replace or mode=append."
    required: false
    default: ""

  publish-artifact:
    description: "Publish site artifact to pipeline"
    required: false
    default: "false"

  artifact-name:
    description: "Artifact name for the built site."
    required: false
    default: "hugo-site"

  archive-name:
    description: "Base name for the archive file without extension."
    required: false
    default: "site"

  archive-output-dir:
    description: "Directory where archive files are written."
    required: false
    default: "dist"

  archive-format:
    description: "Archive format to create: 'none', 'zip', 'tar.gz', 'both'"
    required: false
    default: "none"

  artifact-retention-days:
    description: "Number of days to retain artifact."
    required: false
    default: "7"

  artifact-if-no-files-found:
    description: "What to do if no files are found."
    required: false
    default: "error"

outputs:
  hugo-changed:
    description: "Whether relevant Hugo files changed."
    value: ${{ steps.changed.outputs.hugo-changed }}

runs:
  using: "composite"
  steps:
    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: ${{ inputs.hugo-version }}
        extended: ${{ inputs.extended }}

    - name: Verify Hugo modules
      if: ${{ inputs.debug-state == 'true' }}
      shell: bash
      working-directory: ${{ inputs.source-dir }}
      run: |
        echo "=== Working directory ==="
        pwd

        echo "=== Hugo version ==="
        hugo version || true

        echo "=== Go version ==="
        go version || true

        if [[ -f go.mod ]]; then
          echo "=== go.mod ==="
          cat go.mod

          echo "=== go list -m all ==="
          go list -m all

          echo "=== hugo mod graph ==="
          hugo mod graph
        else
          echo "No go.mod found; skipping Hugo module diagnostics."
        fi

    - name: Determine changed paths
      id: changed
      if: ${{ inputs.check-changed == 'true' }}
      shell: bash
      env:
        HUGO_SOURCE_DIR: ${{ inputs.source-dir }}
        CHANGED_PATHS_MODE: ${{ inputs.changed-paths-mode }}
        CHANGED_PATHS: ${{ inputs.changed-paths }}
      run: bash "${{ github.action_path }}/scripts/hugo-check-changed.sh"

    - name: Restore Hugo cache
      if: ${{ inputs.use-cache == 'true' }}
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/hugo
          ${{ inputs.source-dir }}/resources/_gen
          ${{ inputs.source-dir }}/node_modules
          ${{ inputs.source-dir }}/.hugo_build_cache
        key: >-
          hugo-${{ runner.os }}-${{ inputs.hugo-version }}-${{ inputs.extended }}-${{ inputs.cache-key-suffix }}-${{ hashFiles(format('{0}/go.mod', inputs.source-dir), format('{0}/go.sum', inputs.source-dir), format('{0}/package-lock.json', inputs.source-dir), format('{0}/pnpm-lock.yaml', inputs.source-dir), format('{0}/yarn.lock', inputs.source-dir), format('{0}/hugo.toml', inputs.source-dir), format('{0}/hugo.yaml', inputs.source-dir), format('{0}/hugo.yml', inputs.source-dir), format('{0}/config.toml', inputs.source-dir), format('{0}/config.yaml', inputs.source-dir), format('{0}/config.yml', inputs.source-dir)) }}
        restore-keys: |
          hugo-${{ runner.os }}-${{ inputs.hugo-version }}-${{ inputs.extended }}-${{ inputs.cache-key-suffix }}-
          hugo-${{ runner.os }}-${{ inputs.hugo-version }}-${{ inputs.extended }}-

    - name: Debug build state
      if: ${{ inputs.debug-state == 'true' }}
      shell: bash
      working-directory: ${{ inputs.source-dir }}
      run: |
        echo
        echo "[DEBUG] Hugo Build state"
        echo

        echo "--- pwd ---"
        pwd

        echo
        echo "--- git sha ---"
        git rev-parse HEAD

        echo
        echo "--- git status ---"
        git status --short

        echo
        echo "--- hugo env ---"
        hugo env

        if [[ -f go.mod ]]; then
          echo
          echo "--- go.mod ---"
          cat go.mod

          echo
          echo "--- modules ---"
          go list -m all

          echo
          echo "--- hugo mod graph ---"
          hugo mod graph
        else
          echo "No go.mod found"
        fi

    - name: Build Hugo site
      if: ${{ inputs.check-changed != 'true' || steps.changed.outputs.hugo-changed == 'true' }}
      shell: bash
      env:
        HUGO_SOURCE_DIR: ${{ inputs.source-dir }}
        HUGO_PUBLIC_DIR: ${{ inputs.public-dir }}
        HUGO_BASEURL: ${{ inputs.base-url }}
        HUGO_ENVIRONMENT: ${{ inputs.environment }}
        HUGO_BUILD_FLAGS: ${{ inputs.build-flags }}
        HUGO_TRACE_FILE: ${{ inputs.debug-state == 'true' && format('{0}/hugo-trace.txt', github.workspace) || '' }}
        HUGO_DEBUG_BUILD: ${{ inputs.debug-state == 'true' && 'true' || 'false' }}
      run: bash "${{ github.action_path }}/scripts/hugo-build.sh"

    - name: Dump Hugo trace
      if: ${{ inputs.debug-state == 'true' }}
      shell: bash
      run: |
        echo "--- Hugo trace excerpt ---"

        if [[ -f "${{ github.workspace }}/hugo-trace.txt" ]]; then
          tail -200 "${{ github.workspace }}/hugo-trace.txt"
        else
          echo "hugo-trace.txt not found"
        fi

    - name: Upload Hugo trace
      if: ${{ always() && inputs.debug-state == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: hugo-trace
        path: ${{ github.workspace }}/hugo-trace.txt
        if-no-files-found: warn
        retention-days: 7

    - name: Collect Hugo transform errors
      if: ${{ always() && inputs.debug-state == 'true' }}
      shell: bash
      run: |
        mkdir -p "${{ github.workspace }}/hugo-debug"

        shopt -s nullglob

        files=(/tmp/hugo-transform-error*)

        if ((${#files[@]} > 0)); then
          cp "${files[@]}" "${{ github.workspace }}/hugo-debug/"
        fi

    - name: Upload Hugo transform errors
      if: ${{ always() && inputs.debug-state == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: hugo-transform-errors
        path: ${{ github.workspace }}/hugo-debug/
        if-no-files-found: ignore
        retention-days: 7

    - name: Upload raw build artifact
      if: ${{ inputs.publish-artifact == 'true' && (inputs.check-changed != 'true' || steps.changed.outputs.hugo-changed == 'true') }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.source-dir }}/${{ inputs.public-dir }}
        if-no-files-found: ${{ inputs.artifact-if-no-files-found }}
        retention-days: ${{ inputs.artifact-retention-days }}

    - name: Prepare archive output
      if: ${{ inputs.publish-artifact == 'true' && inputs.archive-format != 'none' && (inputs.check-changed != 'true' || steps.changed.outputs.hugo-changed == 'true') }}
      shell: bash
      env:
        HUGO_SOURCE_DIR: ${{ inputs.source-dir }}
        HUGO_PUBLIC_DIR: ${{ inputs.public-dir }}
        ARCHIVE_NAME: ${{ inputs.archive-name }}
        ARCHIVE_FORMAT: ${{ inputs.archive-format }}
        ARCHIVE_OUTPUT_DIR: ${{ inputs.archive-output-dir }}
      run: bash "${{ github.action_path }}/scripts/hugo-archive.sh"

    - name: Upload ZIP archive
      if: ${{ inputs.publish-artifact == 'true' && (inputs.archive-format == 'zip' || inputs.archive-format == 'both') && (inputs.check-changed != 'true' || steps.changed.outputs.hugo-changed == 'true') }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}-zip
        path: ${{ inputs.source-dir }}/${{ inputs.archive-output-dir }}/${{ inputs.archive-name }}.zip
        archive: false
        if-no-files-found: ${{ inputs.artifact-if-no-files-found }}
        retention-days: ${{ inputs.artifact-retention-days }}

    - name: Upload TAR.GZ archive
      if: ${{ inputs.publish-artifact == 'true' && (inputs.archive-format == 'tar.gz' || inputs.archive-format == 'both') && (inputs.check-changed != 'true' || steps.changed.outputs.hugo-changed == 'true') }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}-tar-gz
        path: ${{ inputs.source-dir }}/${{ inputs.archive-output-dir }}/${{ inputs.archive-name }}.tar.gz
        archive: false
        if-no-files-found: ${{ inputs.artifact-if-no-files-found }}
        retention-days: ${{ inputs.artifact-retention-days }}

    - name: Save Hugo cache state
      if: ${{ always() && inputs.use-cache == 'true' }}
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/hugo
          ${{ inputs.source-dir }}/resources/_gen
          ${{ inputs.source-dir }}/node_modules
          ${{ inputs.source-dir }}/.hugo_build_cache
        key: >-
          hugo-${{ runner.os }}-${{ inputs.hugo-version }}-${{ inputs.extended }}-${{ inputs.cache-key-suffix }}-${{ hashFiles(format('{0}/go.mod', inputs.source-dir), format('{0}/go.sum', inputs.source-dir), format('{0}/package-lock.json', inputs.source-dir), format('{0}/pnpm-lock.yaml', inputs.source-dir), format('{0}/yarn.lock', inputs.source-dir), format('{0}/hugo.toml', inputs.source-dir), format('{0}/hugo.yaml', inputs.source-dir), format('{0}/hugo.yml', inputs.source-dir), format('{0}/config.toml', inputs.source-dir), format('{0}/config.yaml', inputs.source-dir), format('{0}/config.yml', inputs.source-dir)) }}
