---
###################################################################
# Run TruffleHog against a consuming repository to detect secrets #
###################################################################

name: TruffleHog secret scan

on:
  workflow_call:
    inputs:
      trufflehog-version:
        description: >
          TruffleHog release version to install, without a leading "v".
          Example: "3.96.0". Check releases at
          https://github.com/trufflesecurity/trufflehog/releases.
        required: false
        type: string
        default: "3.96.0"

      mode:
        description: >
          Scan mode: "git" scans Git history; "filesystem" scans only the
          checked-out working tree.
        required: false
        type: string
        default: "git"

      source:
        description: >
          Source path or repository URL to scan. For "git" mode, this defaults
          to the current checked-out repository (".").
        required: false
        type: string
        default: "."

      config-path:
        description: >
          Optional repository-local TruffleHog custom detectors configuration
          file. Leave empty to use TruffleHog's built-in detectors only.
        required: false
        type: string
        default: ""

      results:
        description: >
          Result types to report. Recommended default is "verified" for
          confirmed credentials. Other accepted values include "unknown" and
          "invalid". Multiple values can be provided as a comma-separated list,
          i.e. "verified,unknown".
        required: false
        type: string
        default: "verified"

      fail-on-findings:
        description: >
          Fail the workflow when TruffleHog reports one or more findings in
          the selected result categories.
        required: false
        type: boolean
        default: true

      artifact-retention-days:
        description: "Days to retain TruffleHog JSON reports."
        required: false
        type: number
        default: 30

jobs:
  trufflehog:
    name: TruffleHog secret scan
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout consuming repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install TruffleHog
        timeout-minutes: 5
        shell: bash
        env:
          TRUFFLEHOG_VERSION: ${{ inputs.trufflehog-version }}
        run: |
          set -euo pipefail

          if [[ ! "${TRUFFLEHOG_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Invalid TruffleHog version::Expected a semantic version without a leading 'v', such as 3.96.0."
            exit 1
          fi

          asset="trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/${asset}"
          archive_path="${RUNNER_TEMP}/${asset}"
          extract_dir="${RUNNER_TEMP}/trufflehog"
          bin_dir="${RUNNER_TEMP}/bin"

          echo "Downloading TruffleHog v${TRUFFLEHOG_VERSION}"
          echo "Download URL: ${url}"

          curl --fail --location --retry 3 \
            --output "${archive_path}" \
            "${url}"

          mkdir --parents "${extract_dir}" "${bin_dir}"

          tar --extract \
            --gzip \
            --file "${archive_path}" \
            --directory "${extract_dir}"

          install --mode 0755 \
            "${extract_dir}/trufflehog" \
            "${bin_dir}/trufflehog"

          echo "${bin_dir}" >> "${GITHUB_PATH}"

          export PATH="${bin_dir}:${PATH}"

          echo "Installed TruffleHog version:"
          trufflehog --version

      - name: Run TruffleHog
        id: trufflehog
        timeout-minutes: 30
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          SOURCE: ${{ inputs.source }}
          CONFIG_PATH: ${{ inputs.config-path }}
          RESULTS: ${{ inputs.results }}
        run: |
          set -o pipefail

          mkdir --parents trufflehog-reports

          ## Resolve scan command based on mode.
          case "${MODE}" in
            git)
              ## For git mode, SOURCE is typically ".". Use a file:// URL to
              #  indicate a local repository for TruffleHog.
              if [[ "${SOURCE}" == "." ]]; then
                scan_target="file://."
              else
                scan_target="${SOURCE}"
              fi
              scan_command=(trufflehog git "${scan_target}")
              ;;
            filesystem)
              if [[ ! -e "${SOURCE}" ]]; then
                echo "::error title=Missing scan source::source '${SOURCE}' does not exist."
                exit 1
              fi
              scan_command=(trufflehog filesystem "${SOURCE}")
              ;;
            *)
              echo "::error title=Invalid TruffleHog mode::mode must be 'git' or 'filesystem'; received '${MODE}'."
              exit 1
              ;;
          esac

          ## Common CLI flags.
          cli_args=(
            --json
            "--results=${RESULTS}"
          )

          if [[ -n "${CONFIG_PATH}" ]]; then
            if [[ -f "${CONFIG_PATH}" ]]; then
              cli_args+=(--config "${CONFIG_PATH}")
            else
              echo "::error title=Missing TruffleHog config::config-path '${CONFIG_PATH}' does not exist."
              exit 1
            fi
          fi

          report_file="trufflehog-reports/trufflehog-results.json"

          echo "Running TruffleHog ${MODE} scan"
          echo "Command:"
          printf '  %q' "${scan_command[@]}" "${cli_args[@]}"
          echo

          set +e

          "${scan_command[@]}" \
            "${cli_args[@]}" \
            > "${report_file}"

          scan_exit_code=$?

          set -e

          echo "exit_code=${scan_exit_code}" >> "${GITHUB_OUTPUT}"
          echo "TruffleHog exit code: ${scan_exit_code}"

          if [[ "${scan_exit_code}" -ne 0 ]]; then
            echo "::warning title=TruffleHog scan returned non-zero exit code::TruffleHog exited with status ${scan_exit_code}."
          fi

          if [[ -s "${report_file}" ]]; then
            echo "TruffleHog findings were written to '${report_file}'."
          else
            rm --force "${report_file}"

            echo "::notice title=No TruffleHog findings::TruffleHog completed successfully and reported no findings for the selected result types."
          fi

          ## Do not fail yet; allow artifact upload and policy enforcement.
          exit 0

      - name: Upload TruffleHog results
        if: always() && hashFiles('trufflehog-reports/trufflehog-results.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: trufflehog-scan-results
          path: trufflehog-reports/trufflehog-results.json
          retention-days: ${{ inputs.artifact-retention-days }}

      - name: Fail if TruffleHog found secrets
        if: >
          always() &&
          inputs.fail-on-findings &&
          steps.trufflehog.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "::error title=Potential secrets detected::TruffleHog reported one or more possible secrets."
          echo "Download the trufflehog-scan-results artifact and triage any findings."
          exit 1
