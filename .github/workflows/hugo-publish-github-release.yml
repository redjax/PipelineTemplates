---
##############################################################################
# Hugo Publish to GitHub Release                                             #
#                                                                            #
# This reusable workflow publishes a built Hugo site artifact as a GitHub    #
# Release. It is destination-specific and contains only the inputs, secrets, #
# and release packaging logic needed for release publication.                #
#                                                                            #
# Flow:                                                                      #
# - hugo-site-main.yml handles the build and release lane selection.         #
# - hugo-publish-dispatch.yml selects release publication when requested.    #
# - hugo-publish-router.yml routes the target "github-release" here.         #
# - This workflow creates or updates the GitHub Release assets.              #
##############################################################################

name: Hugo Publish GitHub Release

on:
  workflow_call:
    inputs:
      artifact-name:
        required: false
        type: string
        default: "hugo-site"
      run-id:
        required: false
        type: string
        default: ""
      release-name:
        required: false
        type: string
        default: ""
      release-version:
        required: false
        type: string
        default: ""
      release-tag:
        required: false
        type: string
        default: ""
      runner-image:
        required: false
        type: string
        default: ubuntu-latest
    secrets:
      release-bot-pat:
        required: false

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ${{ inputs.runner-image }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}
          path: ./_published

      - name: Prepare release metadata
        id: rel
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release-version }}
          RELEASE_NAME: ${{ inputs.release-name }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          set -Eeuo pipefail
          if [[ -n "${RELEASE_TAG}" ]]; then
            TAG="${RELEASE_TAG}"
          elif [[ -n "${RELEASE_VERSION}" ]]; then
            TAG="site-v${RELEASE_VERSION}"
          else
            TAG="site"
          fi

          if [[ -n "${RELEASE_NAME}" ]]; then
            NAME="${RELEASE_NAME}"
          elif [[ -n "${RELEASE_VERSION}" ]]; then
            NAME="Site v${RELEASE_VERSION}"
          else
            NAME="site"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Select release assets
        id: assets
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          tar_files=(./_published/*.tar.gz)
          zip_files=(./_published/*.zip)

          if (( ${#tar_files[@]} > 0 )); then
            printf '%s\n' "${tar_files[@]}" > /tmp/release-assets.txt
          elif (( ${#zip_files[@]} > 0 )); then
            printf '%s\n' "${zip_files[@]}" > /tmp/release-assets.txt
          else
            mkdir -p ./_release
            tar -C ./_published -czf ./_release/site.tar.gz .
            echo "./_release/site.tar.gz" > /tmp/release-assets.txt
          fi

          {
            echo 'files<<EOF'
            cat /tmp/release-assets.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          files: ${{ steps.assets.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.release-bot-pat || github.token }}
