---
#####################################################################################################
# Run security scans against the PipelineTemplates repository itself using workflows defined within #
#                                                                                                   #
# This workflow orchestrates the centralized reusable security scans:                               #
#   - CodeQL analysis                                                                               #
#   - Gitleaks secret scanning                                                                      #
#   - OSV dependency vulnerability scanning                                                         #
#####################################################################################################

name: PipelineTemplates Security Scans

on:
  # pull_request:
  #   branches:
  #     - main

  # push:
  #   branches:
  #     - main

  schedule:
    ## Every day at 01:00 UTC.
    - cron: "0 1 * * *"

  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL analysis
    uses: ./.github/workflows/codeql-analysis.yml
    with:
      ## Analyze GitHub Actions workflow code in this repository.
      languages: "actions"

      ## Leave commented to use default CodeQL queries
      # queries: "+security-extended"

      run-build: false

      ## Upload findings to this repository's GitHub Code Scanning dashboard.
      upload-sarif: true

      ## Fail only when CodeQL itself encounters an analysis error.
      fail-on-error: true

  gitleaks:
    name: Gitleaks secret scan
    uses: ./.github/workflows/gitleaks-secret-scan.yml
    with:
      gitleaks-version: "8.30.1"

      ## Scan current content and complete Git history.
      mode: git

      ## Fail after reports are uploaded if secrets are detected.
      fail-on-findings: true

      ## SARIF and JSON are always produced. CSV is unnecessary unless you
      #  explicitly need spreadsheet-oriented report output.
      generate-csv-report: false

      artifact-retention-days: 30

      ## Use local PipelineTemplates/.gitleaks.toml config if it exists
      config-path: ".gitleaks.toml"

      ## Uncomment if PipelineTemplates provides a baseline report.
      # baseline-path: ".gitleaks-baseline.json"

  trivy:
    name: Trivy security scan
    uses: ./.github/workflows/trivy-scan.yml
    with:
      ## Use shared scripts from the central PipelineTemplates main branch.
      ##
      ## Set this to a feature branch when validating changes to shared scripts,
      ## or a release tag/commit SHA for stable and reproducible consumption.
      pipelinetemplates-ref: main

      ## Pin the scanner version. Do not use "latest".
      trivy-version: "0.73.0"

      ## Scan the complete repository filesystem, including workflow files,
      ## shell scripts, dependency manifests, and configuration/IaC content.
      scan-type: filesystem
      scan-path: "."

      ## Perform vulnerability, secret-pattern, and misconfiguration scanning.
      ##
      ## Gitleaks remains the primary secret scanning control, while Trivy
      ## provides additional secret-pattern coverage alongside its vulnerability
      ## and misconfiguration scanners.
      scanners: "vuln,secret,misconfig"

      ## Restrict the policy report to actionable high-priority findings.
      severity: "HIGH,CRITICAL"

      ## Do not block on findings with no available remediation.
      ignore-unfixed: true

      ## No repository-specific Trivy configuration is currently required.
      # config-path: ".trivy.yaml"

      ## Uncomment only when generated/vendored content requires exclusion.
      # skip-dirs: ".git,node_modules,vendor,dist,build"

      ## Upload JSON and SARIF reports first, then fail when matching findings
      ## are detected.
      fail-on-findings: true

      artifact-retention-days: 30
