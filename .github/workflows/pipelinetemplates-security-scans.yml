---
#####################################################################################################
# Run security scans against the PipelineTemplates repository itself using workflows defined within #
#                                                                                                   #
# This workflow orchestrates the centralized reusable security scans:                               #
#   - CodeQL analysis                                                                               #
#   - Gitleaks secret scanning                                                                      #
#   - OSV dependency vulnerability scanning                                                         #
#####################################################################################################

name: PipelineTemplates Security Scans

on:
  # pull_request:
  #   branches:
  #     - main

  # push:
  #   branches:
  #     - main

  schedule:
    ## Every day at 01:00 UTC.
    - cron: "0 1 * * *"

  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL analysis
    uses: ./.github/workflows/codeql-analysis.yml
    with:
      ## Analyze GitHub Actions workflow code in this repository.
      languages: "actions"

      ## Leave commented to use default CodeQL queries
      # queries: "+security-extended"

      run-build: false

      ## Upload findings to this repository's GitHub Code Scanning dashboard.
      upload-sarif: true

      ## Fail only when CodeQL itself encounters an analysis error.
      fail-on-error: true

  gitleaks:
    name: Gitleaks secret scan
    uses: ./.github/workflows/gitleaks-secret-scan.yml
    with:
      gitleaks-version: "8.30.1"

      ## Scan current content and complete Git history.
      mode: git

      ## Fail after reports are uploaded if secrets are detected.
      fail-on-findings: true

      ## SARIF and JSON are always produced. CSV is unnecessary unless you
      #  explicitly need spreadsheet-oriented report output.
      generate-csv-report: false

      artifact-retention-days: 30

      ## Use local PipelineTemplates/.gitleaks.toml config if it exists
      # config-path: ".gitleaks.toml"

      ## Uncomment if PipelineTemplates provides a baseline report.
      # baseline-path: ".gitleaks-baseline.json"
