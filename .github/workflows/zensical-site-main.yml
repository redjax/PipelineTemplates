---
################################################################################
# Reusable orchestration workflow for Zensical static documentation sites      #
#                                                                              #
# Coordinates optional bump-my-version automation, Zensical builds, static     #
# site artifact releases, and optional publishing to GitHub Pages, Cloudflare  #
# Pages, and/or a deployment branch.                                           #
################################################################################

name: Zensical Site Main Pipeline

on:
  workflow_call:
    inputs:
      publish-targets:
        description: 'JSON array of publishing targets, e.g. ["github-pages","cloudflare-pages","branch"].'
        required: false
        type: string
        default: "[]"

      python-version:
        description: "Python version used by Zensical."
        required: false
        type: string
        # renovate: datasource=python-version depName=python versioning=pep440
        default: "3.14.8"

      uv-version:
        description: "UV version used for the Zensical build."
        required: false
        type: string
        # renovate: datasource=pypi depName=uv versioning=pep440
        default: "0.12.18"

      working-directory:
        description: "Repository-relative directory from which Zensical runs."
        required: false
        type: string
        default: "."

      python-project-dir:
        description: "Repository-relative directory containing pyproject.toml."
        required: false
        type: string
        default: "."

      zensical-config:
        description: "Optional Zensical configuration file path."
        required: false
        type: string
        default: ""

      docs-dir:
        description: "Optional documentation source directory."
        required: false
        type: string
        default: ""

      output-dir:
        description: "Generated static-site output directory."
        required: false
        type: string
        default: "site"

      strict:
        description: "Fail builds on Zensical warnings."
        required: false
        type: boolean
        default: true

      clean:
        description: "Perform a clean Zensical build."
        required: false
        type: boolean
        default: true

      build-flags:
        description: "Additional whitespace-delimited Zensical build flags."
        required: false
        type: string
        default: ""

      use-cache:
        description: "Enable UV dependency caching."
        required: false
        type: boolean
        default: true

      cache-key-suffix:
        description: "Optional UV cache-key suffix."
        required: false
        type: string
        default: ""

      check-changed:
        description: "Enable Zensical changed-path detection for the standard build lane."
        required: false
        type: boolean
        default: false

      changed-paths-mode:
        description: "How changed-paths is applied: default, replace, or append."
        required: false
        type: string
        default: "default"

      changed-paths:
        description: "Newline-delimited repository-relative Git pathspecs used for standard build change detection."
        required: false
        type: string
        default: ""

      artifact-name:
        description: "Generated static-site workflow artifact name."
        required: false
        type: string
        default: "zensical-site"

      artifact-retention-days:
        description: "Generated site artifact retention period in days."
        required: false
        type: number
        default: 7

      artifact-if-no-files-found:
        description: "Behavior when generated site output is absent: error, warn, or ignore."
        required: false
        type: string
        default: "error"

      versioned:
        description: "Whether the Zensical site uses bump-my-version versioning."
        required: false
        type: boolean
        default: false

      version-file:
        description: "Repository-relative version file used by versioned sites."
        required: false
        type: string
        default: ".version"

      bump-config:
        description: "Repository-relative bump-my-version configuration file."
        required: false
        type: string
        default: ".bumpversion.toml"

      bump-script:
        description: "PipelineTemplates-relative Zensical version-bump script path."
        required: false
        type: string
        default: "shared/scripts/ci-cd/zensical/bump-site-version.sh"

      bump-changed-paths-file:
        description: "Optional repository-relative file containing newline-delimited Git pathspecs that trigger a version bump."
        required: false
        type: string
        default: ""

      bump-changed-paths:
        description: "Optional inline newline-delimited Git pathspecs that trigger a version bump."
        required: false
        type: string
        default: ""

      bump-pr-branch:
        description: "Automated version-bump pull request branch."
        required: false
        type: string
        default: "bump/zensical-site-version"

      bump-base-branch:
        description: "Target branch for the automated version-bump pull request."
        required: false
        type: string
        default: "main"

      bump-commit-marker:
        description: "Unique marker added to automated version-bump commits."
        required: false
        type: string
        default: "[zensical-version-bump]"

      release-prefix:
        description: "Prefix used for generated release tags."
        required: false
        type: string
        default: "site"

      release-tag:
        description: "Optional explicit release tag."
        required: false
        type: string
        default: ""

      release-name:
        description: "Optional explicit GitHub Release name."
        required: false
        type: string
        default: ""

      release-version:
        description: "Optional explicit release version."
        required: false
        type: string
        default: ""

      create-github-release:
        description: "Create a GitHub Release with static-site archives."
        required: false
        type: boolean
        default: true

      cloudflare-pages-project:
        description: "Cloudflare Pages project name. Required when cloudflare-pages is selected."
        required: false
        type: string
        default: ""

      cloudflare-pages-branch:
        description: "Cloudflare Pages production or preview branch."
        required: false
        type: string
        default: "main"

      cloudflare-wrangler-version:
        description: "Wrangler version used for Cloudflare Pages deployment."
        required: false
        type: string
        # renovate: datasource=npm depName=wrangler versioning=npm
        default: "4.51.0"

      branch-name:
        description: "Target branch used when branch publishing is selected."
        required: false
        type: string
        default: "gh-pages"

      branch-commit-message:
        description: "Commit message used for deployment-branch updates."
        required: false
        type: string
        default: "Deploy Zensical site"

      runner-image:
        description: "GitHub-hosted runner image or self-hosted runner label."
        required: false
        type: string
        default: "ubuntu-latest"

      templates-ref:
        description: "PipelineTemplates ref containing the shared Zensical version-bump script."
        required: false
        type: string
        default: "main"

      checkout-ref:
        description: "Optional repository ref to build. Empty uses the triggering ref."
        required: false
        type: string
        default: ""

      debug-state:
        description: "Enable detailed build path, configuration, tool-version, and output diagnostics."
        required: false
        type: boolean
        default: false

    secrets:
      release-bot-pat:
        description: "Optional PAT or GitHub App token used for bump pull requests, tags, releases, and branch publishing."
        required: false

      cloudflare-api-token:
        description: "Cloudflare API token required when cloudflare-pages is selected."
        required: false

      cloudflare-account-id:
        description: "Cloudflare account ID required when cloudflare-pages is selected."
        required: false

permissions:
  contents: write
  actions: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  decide:
    name: Decide Zensical pipeline lane
    runs-on: ${{ inputs.runner-image }}

    outputs:
      event-is-push: ${{ steps.decide.outputs.event-is-push }}
      bump-marker-commit: ${{ steps.decide.outputs.bump-marker-commit }}
      should-bump: ${{ steps.decide.outputs.should-bump }}
      should-release-versioned: ${{ steps.decide.outputs.should-release-versioned }}
      should-run-standard: ${{ steps.decide.outputs.should-run-standard }}
      short-sha: ${{ steps.decide.outputs.short-sha }}

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout-ref != '' && inputs.checkout-ref || github.ref }}

      - name: Decide pipeline lane
        id: decide
        shell: bash
        env:
          VERSIONED: ${{ inputs.versioned }}
          BUMP_MARKER: ${{ inputs.bump-commit-marker }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -Eeuo pipefail

          head_subject="$(git log -1 --format=%s)"
          short_sha="$(git rev-parse --short=7 HEAD)"

          event_is_push="false"
          bump_marker_commit="false"
          should_bump="false"
          should_release_versioned="false"
          should_run_standard="false"

          if [[ "${EVENT_NAME}" == "push" ]]; then
            event_is_push="true"
          fi

          if [[ "${VERSIONED}" == "true" && "${head_subject}" == *"${BUMP_MARKER}"* ]]; then
            bump_marker_commit="true"
          fi

          if [[ "${VERSIONED}" == "true" && "${event_is_push}" == "true" && "${bump_marker_commit}" != "true" ]]; then
            should_bump="true"
          fi

          if [[ "${VERSIONED}" == "true" && "${event_is_push}" == "true" && "${bump_marker_commit}" == "true" ]]; then
            should_release_versioned="true"
          fi

          if [[ "${VERSIONED}" != "true" || "${event_is_push}" != "true" ]]; then
            should_run_standard="true"
          fi

          echo "[INFO] event=${EVENT_NAME}"
          echo "[INFO] head-subject=${head_subject}"
          echo "[INFO] versioned=${VERSIONED}"
          echo "[INFO] bump-marker=${BUMP_MARKER}"
          echo "[INFO] should-bump=${should_bump}"
          echo "[INFO] should-release-versioned=${should_release_versioned}"
          echo "[INFO] should-run-standard=${should_run_standard}"

          {
            echo "event-is-push=${event_is_push}"
            echo "bump-marker-commit=${bump_marker_commit}"
            echo "should-bump=${should_bump}"
            echo "should-release-versioned=${should_release_versioned}"
            echo "should-run-standard=${should_run_standard}"
            echo "short-sha=${short_sha}"
          } >> "${GITHUB_OUTPUT}"

  bump:
    name: Create version-bump pull request
    if: ${{ needs.decide.outputs.should-bump == 'true' }}
    needs: decide
    uses: ./.github/workflows/zensical-version-bump.yml
    with:
      version-file: ${{ inputs.version-file }}
      bump-config: ${{ inputs.bump-config }}
      bump-script: ${{ inputs.bump-script }}
      changed-paths-file: ${{ inputs.bump-changed-paths-file }}
      changed-paths: ${{ inputs.bump-changed-paths }}

      pr-branch: ${{ inputs.bump-pr-branch }}
      base-branch: ${{ inputs.bump-base-branch }}
      pr-title: "chore(release): bump Zensical site version ${{ inputs.bump-commit-marker }}"
      pr-body: "Automated version bump for Zensical site changes."

      # Do not explicitly forward python-version or
      # bump-my-version-version here. The called workflow owns those
      # Renovate-managed defaults, preventing duplicate hard-coded pins.
      runner-image: ${{ inputs.runner-image }}
      templates-ref: ${{ inputs.templates-ref }}
    secrets:
      release-bot-pat: ${{ secrets.release-bot-pat }}

  build-versioned:
    name: Build versioned Zensical site
    if: ${{ needs.decide.outputs.should-release-versioned == 'true' }}
    needs: decide
    uses: ./.github/workflows/zensical-build.yml
    with:
      python-version: ${{ inputs.python-version }}
      uv-version: ${{ inputs.uv-version }}
      working-directory: ${{ inputs.working-directory }}
      python-project-dir: ${{ inputs.python-project-dir }}
      zensical-config: ${{ inputs.zensical-config }}
      docs-dir: ${{ inputs.docs-dir }}
      output-dir: ${{ inputs.output-dir }}

      clean: ${{ inputs.clean }}
      strict: ${{ inputs.strict }}
      build-flags: ${{ inputs.build-flags }}
      use-cache: ${{ inputs.use-cache }}
      cache-key-suffix: ${{ inputs.cache-key-suffix }}

      # The post-bump merge must always build the release artifact.
      check-changed: false

      artifact-name: ${{ inputs.artifact-name }}
      artifact-retention-days: ${{ inputs.artifact-retention-days }}
      artifact-if-no-files-found: ${{ inputs.artifact-if-no-files-found }}

      checkout-ref: ${{ inputs.checkout-ref }}
      runner-image: ${{ inputs.runner-image }}
      debug-state: ${{ inputs.debug-state }}

  build-standard:
    name: Build standard Zensical site
    if: ${{ needs.decide.outputs.should-run-standard == 'true' }}
    needs: decide
    uses: ./.github/workflows/zensical-build.yml
    with:
      python-version: ${{ inputs.python-version }}
      uv-version: ${{ inputs.uv-version }}
      working-directory: ${{ inputs.working-directory }}
      python-project-dir: ${{ inputs.python-project-dir }}
      zensical-config: ${{ inputs.zensical-config }}
      docs-dir: ${{ inputs.docs-dir }}
      output-dir: ${{ inputs.output-dir }}

      clean: ${{ inputs.clean }}
      strict: ${{ inputs.strict }}
      build-flags: ${{ inputs.build-flags }}
      use-cache: ${{ inputs.use-cache }}
      cache-key-suffix: ${{ inputs.cache-key-suffix }}

      check-changed: ${{ inputs.check-changed }}
      changed-paths-mode: ${{ inputs.changed-paths-mode }}
      changed-paths: ${{ inputs.changed-paths }}

      artifact-name: ${{ inputs.artifact-name }}
      artifact-retention-days: ${{ inputs.artifact-retention-days }}
      artifact-if-no-files-found: ${{ inputs.artifact-if-no-files-found }}

      checkout-ref: ${{ inputs.checkout-ref }}
      runner-image: ${{ inputs.runner-image }}
      debug-state: ${{ inputs.debug-state }}

  release-versioned:
    name: Release versioned Zensical site
    if: ${{ needs.decide.outputs.should-release-versioned == 'true' }}
    needs:
      - decide
      - build-versioned
    uses: ./.github/workflows/zensical-gh-release.yml
    with:
      versioned: true
      version-file: ${{ inputs.version-file }}
      artifact-name: ${{ inputs.artifact-name }}
      build-run-id: ${{ github.run_id }}
      checkout-ref: ${{ inputs.checkout-ref }}

      release-prefix: ${{ inputs.release-prefix }}
      release-tag: ${{ inputs.release-tag }}
      release-name: ${{ inputs.release-name }}
      release-version: ${{ inputs.release-version }}

      create-github-release: ${{ inputs.create-github-release }}
      runner-image: ${{ inputs.runner-image }}
    secrets:
      release-bot-pat: ${{ secrets.release-bot-pat }}

  release-standard:
    name: Release standard Zensical site
    if: ${{ needs.decide.outputs.should-run-standard == 'true' }}
    needs:
      - decide
      - build-standard
    uses: ./.github/workflows/zensical-gh-release.yml
    with:
      versioned: false
      version-file: ${{ inputs.version-file }}
      artifact-name: ${{ inputs.artifact-name }}
      build-run-id: ${{ github.run_id }}
      checkout-ref: ${{ inputs.checkout-ref }}

      release-prefix: ${{ inputs.release-prefix }}
      release-tag: >-
        ${{
          inputs.release-tag != '' &&
          inputs.release-tag ||
          format('{0}-{1}', inputs.release-prefix, needs.decide.outputs.short-sha)
        }}
      release-name: ${{ inputs.release-name }}
      release-version: ${{ inputs.release-version }}

      create-github-release: ${{ inputs.create-github-release }}
      runner-image: ${{ inputs.runner-image }}
    secrets:
      release-bot-pat: ${{ secrets.release-bot-pat }}

  publish-versioned:
    name: Publish versioned Zensical site
    if: >-
      ${{
        needs.decide.outputs.should-release-versioned == 'true' &&
        inputs.publish-targets != '[]'
      }}
    needs:
      - decide
      - release-versioned
    uses: ./.github/workflows/zensical-publish-dispatch.yml
    with:
      publish-targets: ${{ inputs.publish-targets }}
      artifact-name: ${{ inputs.artifact-name }}
      run-id: ${{ github.run_id }}
      runner-image: ${{ inputs.runner-image }}

      cloudflare-pages-project: ${{ inputs.cloudflare-pages-project }}
      cloudflare-pages-branch: ${{ inputs.cloudflare-pages-branch }}
      cloudflare-wrangler-version: ${{ inputs.cloudflare-wrangler-version }}

      branch-name: ${{ inputs.branch-name }}
      branch-commit-message: ${{ inputs.branch-commit-message }}
    secrets:
      release-bot-pat: ${{ secrets.release-bot-pat }}
      cloudflare-api-token: ${{ secrets.cloudflare-api-token }}
      cloudflare-account-id: ${{ secrets.cloudflare-account-id }}

  publish-standard:
    name: Publish standard Zensical site
    if: >-
      ${{
        needs.decide.outputs.should-run-standard == 'true' &&
        inputs.publish-targets != '[]'
      }}
    needs:
      - decide
      - release-standard
    uses: ./.github/workflows/zensical-publish-dispatch.yml
    with:
      publish-targets: ${{ inputs.publish-targets }}
      artifact-name: ${{ inputs.artifact-name }}
      run-id: ${{ github.run_id }}
      runner-image: ${{ inputs.runner-image }}

      cloudflare-pages-project: ${{ inputs.cloudflare-pages-project }}
      cloudflare-pages-branch: ${{ inputs.cloudflare-pages-branch }}
      cloudflare-wrangler-version: ${{ inputs.cloudflare-wrangler-version }}

      branch-name: ${{ inputs.branch-name }}
      branch-commit-message: ${{ inputs.branch-commit-message }}
    secrets:
      release-bot-pat: ${{ secrets.release-bot-pat }}
      cloudflare-api-token: ${{ secrets.cloudflare-api-token }}
      cloudflare-account-id: ${{ secrets.cloudflare-account-id }}
