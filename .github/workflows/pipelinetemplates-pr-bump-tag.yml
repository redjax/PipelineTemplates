---
####################################################
# PR pipeline: detect changed components and preview
# releases without publishing tags.
####################################################

name: PR checks - Bump & tag

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/actions/**"
      - "gitlab/components/**"
      - "concourse/components/**"
      - "woodpecker/components/**"
      - "**/VERSION"
      - "**/.bumpversion.toml"

  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run
        required: false
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run component release script
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            ./shared/scripts/bash/versioning/release-components.sh --dry-run --no-push
          else
            ./shared/scripts/bash/versioning/release-components.sh --dry-run --no-push
          fi
