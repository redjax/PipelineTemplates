---
######################################################
# PR pipeline: detect changed components and preview #
# releases without publishing tags.                  #
######################################################

name: PR checks - Bump & tag

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/actions/**"
      - "gitlab/components/**"
      - "concourse/components/**"
      - "woodpecker/components/**"
      - "**/VERSION"
      - "**/.bumpversion.toml"

  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run
        required: false
        type: boolean
        default: true

jobs:
  release-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Preview component version bumps & releases
        run: |
          ./shared/scripts/bash/versioning/release-components.sh \
            --dry-run \
            --no-push \
            --no-commit

      - name: Preview git tags
        run: |
          ./shared/scripts/bash/versioning/git-tag-components.sh \
            --dry-run
