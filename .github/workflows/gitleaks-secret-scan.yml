---
##################################################################
# Run Gitleaks against a consuming repository to detect secrets. #
##################################################################

name: Gitleaks secrets scan

on:
  workflow_call:
    inputs:
      gitleaks-version:
        description: >
          Gitleaks version to install, without the leading "v".
          Example: "8.30.1".
          Check release versions at: https://github.com/gitleaks/gitleaks/releases
        required: false
        type: string
        ## https://github.com/gitleaks/gitleaks/releases
        default: "8.30.1"
      mode:
        description: >
          Gitleaks scan mode: "git" to scan git history or "dir" to scan the working directory.
        required: false
        type: string
        default: git
      source:
        description: >
          Source path for the scan when mode=dir. Defaults to current directory.
        required: false
        type: string
        default: .
      config-path:
        description: >
          Optional path to a custom gitleaks.toml config file (relative to repo root).
          If empty, Gitleaks uses its normal precedence (.gitleaks.toml, env vars, built-in defaults).
        required: false
        type: string
        default: ""
      baseline-path:
        description: >
          Optional path to an existing Gitleaks report to use as a baseline.
          Findings present in the baseline are ignored.
        required: false
        type: string
        default: ""
      fail-on-findings:
        description: "Fail the job when Gitleaks reports leaks."
        required: false
        type: boolean
        default: true
      generate-csv-report:
        description: "Generate a CSV report in addition to SARIF and JSON."
        required: false
        type: boolean
        default: false
      artifact-retention-days:
        description: "Days to retain Gitleaks artifacts."
        required: false
        type: number
        default: 30

jobs:
  gitleaks:
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        timeout-minutes: 3
        shell: bash
        env:
          GITLEAKS_VERSION: ${{ inputs.gitleaks-version }}
        run: |
          set -euo pipefail

          if [[ ! "${GITLEAKS_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Invalid Gitleaks version::Expected a version without a leading 'v', for example: 8.30.1."
            exit 1
          fi

          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          archive="${RUNNER_TEMP}/${asset}"
          install_dir="${RUNNER_TEMP}/gitleaks"
          bin_dir="${RUNNER_TEMP}/bin"

          echo "Downloading Gitleaks v${GITLEAKS_VERSION}"
          curl --fail --location --retry 3 \
            --output "${archive}" \
            "${url}"

          mkdir --parents "${install_dir}" "${bin_dir}"

          tar --extract \
            --gzip \
            --file "${archive}" \
            --directory "${install_dir}"

          install --mode 0755 \
            "${install_dir}/gitleaks" \
            "${bin_dir}/gitleaks"

          echo "${bin_dir}" >> "${GITHUB_PATH}"
          export PATH="${bin_dir}:${PATH}"

          echo "Installed Gitleaks version:"
          gitleaks version

      - name: Run Gitleaks
        id: gitleaks
        timeout-minutes: 10
        continue-on-error: true
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          SOURCE: ${{ inputs.source }}
          CONFIG_PATH: ${{ inputs.config-path }}
          BASELINE_PATH: ${{ inputs.baseline-path }}
          GENERATE_CSV_REPORT: ${{ inputs.generate-csv-report }}
        run: |
          set -o pipefail

          mkdir --parents gitleaks-reports

          common_args=(
            --redact=100
            --verbose
          )

          if [[ -n "${CONFIG_PATH}" ]]; then
            if [[ -f "${CONFIG_PATH}" ]]; then
              common_args+=(--config "${CONFIG_PATH}")
            else
              echo "::warning title=Missing Gitleaks config::config-path '${CONFIG_PATH}' does not exist; using the default Gitleaks configuration."
            fi
          fi

          if [[ -n "${BASELINE_PATH}" ]]; then
            if [[ -f "${BASELINE_PATH}" ]]; then
              common_args+=(--baseline-path "${BASELINE_PATH}")
            else
              echo "::warning title=Missing Gitleaks baseline::baseline-path '${BASELINE_PATH}' does not exist; ignoring baseline."
            fi
          fi

          case "${MODE}" in
            git)
              ## With no path argument, Gitleaks scans the current working
              #  directory as a Git repository.
              scan_command=(gitleaks git)
              ;;
            dir)
              if [[ ! -e "${SOURCE}" ]]; then
                echo "::error title=Missing scan source::source '${SOURCE}' does not exist."
                exit 1
              fi

              scan_command=(gitleaks dir "${SOURCE}")
              ;;
            *)
              echo "::error title=Invalid Gitleaks mode::mode must be 'git' or 'dir'; received '${MODE}'."
              exit 1
              ;;
          esac

          echo "Running Gitleaks ${MODE} scan"

          ## SARIF is the canonical scan: it determines the workflow result and
          #  is uploaded to GitHub Code Scanning.
          "${scan_command[@]}" \
            "${common_args[@]}" \
            --report-format sarif \
            --report-path gitleaks-reports/gitleaks.sarif

          scan_exit_code=$?

          echo "exit_code=${scan_exit_code}" >> "${GITHUB_OUTPUT}"
          echo "Gitleaks exit code: ${scan_exit_code}"

          ## JSON is a downloadable artifact; it does not alter the canonical
          #  SARIF scan result.
          "${scan_command[@]}" \
            "${common_args[@]}" \
            --report-format json \
            --report-path gitleaks-reports/gitleaks.json || true

          if [[ "${GENERATE_CSV_REPORT}" == "true" ]]; then
            "${scan_command[@]}" \
              "${common_args[@]}" \
              --report-format csv \
              --report-path gitleaks-reports/gitleaks.csv || true
          fi

          exit "${scan_exit_code}"

      - name: List generated files (debug)
        if: always()
        shell: bash
        run: |
          echo "=== Files in gitleaks-reports/ ==="

          ls -lah gitleaks-reports || echo "No gitleaks-reports directory found"

          echo
          echo "=== File contents preview ==="

          for f in gitleaks-reports/gitleaks.*; do
            if [[ -f "$f" ]]; then
              echo "--- $f (first 20 lines) ---"
              head -20 "$f"
              echo
            fi
          done

      - name: Upload SARIF to GitHub Security
        if: always() && hashFiles('gitleaks-reports/gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks-reports/gitleaks.sarif
          category: gitleaks
          wait-for-processing: true

      - name: Upload Gitleaks results (all formats)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gitleaks-scan-results
          path: gitleaks-reports/
          if-no-files-found: warn
          retention-days: ${{ inputs.artifact-retention-days }}

      - name: Fail if leaks were found
        if: inputs.fail-on-findings && steps.gitleaks.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "::error title=Potential secrets detected::Gitleaks reported findings."
          echo "Download the gitleaks-scan-results artifact and triage/rotate leaked secrets."

          exit 1
