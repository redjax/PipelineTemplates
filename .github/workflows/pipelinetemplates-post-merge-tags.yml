---
########################################################
# Post-merge component tag reconciliation              #
#                                                      #
# Runs after a PR into main is merged, then ensures    #
# all component VERSION files have matching git tags.  #
########################################################

name: Post-merge component tags

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch refs
        run: git fetch origin main --tags --force

      - name: Reconcile tags
        env:
          GH_TOKEN: ${{ secrets.PAT_REPO_WRITE }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          ./shared/scripts/bash/versioning/git-tag-components.sh --push
