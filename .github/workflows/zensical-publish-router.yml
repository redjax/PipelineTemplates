---
name: Route Zensical Site Publish Target

on:
  workflow_call:
    inputs:
      target:
        description: "Publishing target: github-pages, cloudflare-pages, or branch."
        required: true
        type: string

      artifact-name:
        required: false
        type: string
        default: "zensical-site"

      run-id:
        required: true
        type: string

      runner-image:
        required: false
        type: string
        default: "ubuntu-latest"

      cloudflare-pages-project:
        required: false
        type: string
        default: ""

      cloudflare-pages-branch:
        required: false
        type: string
        default: "main"

      cloudflare-wrangler-version:
        required: false
        type: string
        default: "4.51.0"

      branch-name:
        required: false
        type: string
        default: "gh-pages"

      branch-commit-message:
        required: false
        type: string
        default: "Deploy Zensical site"

    secrets:
      cloudflare-api-token:
        required: false

      cloudflare-account-id:
        required: false

      release-bot-pat:
        required: false

jobs:
  github-pages:
    if: ${{ inputs.target == 'github-pages' }}
    uses: ./.github/workflows/zensical-publish-gh-pages.yml
    with:
      artifact-name: ${{ inputs.artifact-name }}
      run-id: ${{ inputs.run-id }}
      runner-image: ${{ inputs.runner-image }}

  cloudflare-pages:
    if: ${{ inputs.target == 'cloudflare-pages' }}
    uses: ./.github/workflows/zensical-publish-cloudflare-pages.yml
    with:
      artifact-name: ${{ inputs.artifact-name }}
      run-id: ${{ inputs.run-id }}
      runner-image: ${{ inputs.runner-image }}
      cloudflare-pages-project: ${{ inputs.cloudflare-pages-project }}
      cloudflare-pages-branch: ${{ inputs.cloudflare-pages-branch }}
      wrangler-version: ${{ inputs.cloudflare-wrangler-version }}
    secrets:
      cloudflare-api-token: ${{ secrets.cloudflare-api-token }}
      cloudflare-account-id: ${{ secrets.cloudflare-account-id }}

  branch:
    if: ${{ inputs.target == 'branch' }}
    uses: ./.github/workflows/zensical-publish-branch.yml
    with:
      artifact-name: ${{ inputs.artifact-name }}
      run-id: ${{ inputs.run-id }}
      runner-image: ${{ inputs.runner-image }}
      branch-name: ${{ inputs.branch-name }}
      commit-message: ${{ inputs.branch-commit-message }}
    secrets:
      push-token: ${{ secrets.release-bot-pat }}
