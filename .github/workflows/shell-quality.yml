---
################################################################################
# Shell Quality Orchestrator                                                   #
#                                                                              #
# Calls the individual ShellCheck and shellfmt reusable workflows.             #
#                                                                              #
# This workflow owns only tool selection and input forwarding. Configuration   #
# resolution, installation, scanning, report generation, artifact upload, and  #
# policy enforcement remain in shellcheck.yml and shellfmt.yml.                #
################################################################################

name: Shell Quality

on:
  workflow_call:
    inputs:
      pipelinetemplates-ref:
        required: false
        type: string
        default: main
      tools:
        description: shellcheck, shellfmt, or both
        required: false
        type: string
        default: both
      scan-path:
        required: false
        type: string
        default: "."
      shellcheck-version:
        required: false
        type: string
        default: "0.10.0"
      shellfmt-version:
        required: false
        type: string
        default: "3.10.0"
      shellfmt-mode:
        required: false
        type: string
        default: check
      shellfmt-commit-changes:
        description: >-
          Commit shellfmt changes back to an internal pull request branch.
          Requires shellfmt-mode: write.
        required: false
        type: boolean
        default: false
      shellfmt-commit-message:
        description: >-
          Commit message used for automatic shellfmt formatting commits.
        required: false
        type: string
        default: "style(shell): format shell scripts with shellfmt"
      fail-on-findings:
        required: false
        type: boolean
        default: true
      artifact-retention-days:
        required: false
        type: number
        default: 30

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        env:
          TOOLS: ${{ inputs.tools }}
        run: |
          case "${TOOLS}" in
            shellcheck|shellfmt|both) ;;
            *)
              echo "::error title=Invalid tools input::Use shellcheck, shellfmt, or both."
              exit 1
              ;;
          esac

  shellcheck:
    needs: validate
    if: inputs.tools == 'shellcheck' || inputs.tools == 'both'
    uses: ./.github/workflows/shellcheck.yml
    with:
      pipelinetemplates-ref: ${{ inputs.pipelinetemplates-ref }}
      scan-path: ${{ inputs.scan-path }}
      shellcheck-version: ${{ inputs.shellcheck-version }}
      fail-on-findings: ${{ inputs.fail-on-findings }}
      artifact-name: shellcheck-results
      artifact-retention-days: ${{ inputs.artifact-retention-days }}

  shellfmt:
    needs: validate
    if: inputs.tools == 'shellfmt' || inputs.tools == 'both'
    uses: ./.github/workflows/shellfmt.yml
    with:
      pipelinetemplates-ref: ${{ inputs.pipelinetemplates-ref }}
      scan-path: ${{ inputs.scan-path }}
      shellfmt-version: ${{ inputs.shellfmt-version }}
      mode: ${{ inputs.shellfmt-mode }}
      fail-on-findings: ${{ inputs.fail-on-findings }}
      artifact-name: shellfmt-results
      artifact-retention-days: ${{ inputs.artifact-retention-days }}
      commit-changes: ${{ inputs.shellfmt-commit-changes }}
      commit-message: ${{ inputs.shellfmt-commit-message }}
