---
####################################################################################
# Reusable Shell Quality Workflow                                                  #
#                                                                                  #
# Orchestrates individual ShellCheck and shellfmt reusable workflows.              #
#                                                                                  #
# This workflow intentionally does not install tools, resolve configuration,       #
# discover shell files, parse reports, or upload artifacts. Those responsibilities #
# remain within shellcheck.yml and shellfmt.yml.                                   #
#                                                                                  #
# Consumers may:                                                                   #
#   - Call shellcheck.yml directly.                                                #
#   - Call shellfmt.yml directly.                                                  #
#   - Call this workflow with tools: shellcheck, shellfmt, or both.                #
####################################################################################

name: Shell Quality

on:
  workflow_call:
    inputs:
      pipelinetemplates-ref:
        description: >-
          PipelineTemplates branch, tag, or commit SHA used by the individual
          reusable workflows to retrieve shared scripts and default config.
        required: false
        type: string
        default: main

      tools:
        description: >-
          Tools to run: shellcheck, shellfmt, or both.
        required: false
        type: string
        default: both

      scan-path:
        description: >-
          Repository-relative file or directory containing shell scripts.
        required: false
        type: string
        default: "."

      include-patterns:
        description: >-
          Comma-separated file patterns to include.
        required: false
        type: string
        default: "*.sh,*.bash,*.bats"

      exclude-paths:
        description: >-
          Comma-separated files or directories to exclude.
        required: false
        type: string
        default: ".git,node_modules,vendor,dist,build,.terraform"

      shellcheck-version:
        description: >-
          ShellCheck release version to install.
        required: false
        type: string
        default: "0.10.0"

      shellcheck-config-path:
        description: >-
          Optional repository-relative ShellCheck configuration file.
        required: false
        type: string
        default: ""

      use-default-shellcheck-config:
        description: >-
          Use PipelineTemplates' default ShellCheck configuration when no caller
          configuration file is supplied.
        required: false
        type: boolean
        default: true

      shellfmt-version:
        description: >-
          shellfmt release version to install.
        required: false
        type: string
        default: "3.10.0"

      shellfmt-config-path:
        description: >-
          Optional repository-relative shellfmt options file.
        required: false
        type: string
        default: ""

      use-default-shellfmt-config:
        description: >-
          Use PipelineTemplates' default shellfmt options when no caller options
          file is supplied.
        required: false
        type: boolean
        default: true

      fail-on-findings:
        description: >-
          Fail selected jobs after report upload when findings are detected.
        required: false
        type: boolean
        default: true

      artifact-retention-days:
        description: >-
          Number of days to retain individual ShellCheck and shellfmt artifacts.
        required: false
        type: number
        default: 30

permissions:
  contents: read

jobs:
  validate:
    name: Validate tool selection
    runs-on: ubuntu-latest

    steps:
      - name: Validate tools input
        shell: bash
        env:
          TOOLS: ${{ inputs.tools }}
        run: |
          set -euo pipefail

          case "${TOOLS}" in
            shellcheck|shellfmt|both)
              ;;
            *)
              echo "::error title=Invalid tool selection::tools must be shellcheck, shellfmt, or both."
              exit 1
              ;;
          esac

  shellcheck:
    name: ShellCheck
    needs: validate
    if: inputs.tools == 'shellcheck' || inputs.tools == 'both'
    uses: ./.github/workflows/shellcheck.yml
    with:
      pipelinetemplates-ref: ${{ inputs.pipelinetemplates-ref }}
      scan-path: ${{ inputs.scan-path }}
      shellcheck-version: ${{ inputs.shellcheck-version }}
      include-patterns: ${{ inputs.include-patterns }}
      exclude-paths: ${{ inputs.exclude-paths }}
      shellcheck-config-path: ${{ inputs.shellcheck-config-path }}
      use-default-shellcheck-config: ${{ inputs.use-default-shellcheck-config }}
      fail-on-findings: ${{ inputs.fail-on-findings }}
      artifact-retention-days: ${{ inputs.artifact-retention-days }}

  shellfmt:
    name: shellfmt
    needs: validate
    if: inputs.tools == 'shellfmt' || inputs.tools == 'both'
    uses: ./.github/workflows/shellfmt.yml
    with:
      pipelinetemplates-ref: ${{ inputs.pipelinetemplates-ref }}
      scan-path: ${{ inputs.scan-path }}
      shellfmt-version: ${{ inputs.shellfmt-version }}
      include-patterns: ${{ inputs.include-patterns }}
      exclude-paths: ${{ inputs.exclude-paths }}
      shellfmt-config-path: ${{ inputs.shellfmt-config-path }}
      use-default-shellfmt-config: ${{ inputs.use-default-shellfmt-config }}
      fail-on-findings: ${{ inputs.fail-on-findings }}
      artifact-retention-days: ${{ inputs.artifact-retention-days }}
