---
################################################################################
# Shell Quality Orchestrator                                                   #
#                                                                              #
# Calls the individual ShellCheck and shellfmt reusable workflows.             #
#                                                                              #
# This workflow owns only tool selection and input forwarding. Configuration   #
# resolution, installation, scanning, report generation, artifact upload, and  #
# policy enforcement remain in shellcheck.yml and shellfmt.yml.                #
################################################################################

name: Shell Quality

on:
  workflow_call:
    inputs:
      pipelinetemplates-ref:
        description: >-
          PipelineTemplates branch, tag, or commit SHA used by the individual
          workflows to retrieve shared scripts and default configurations.
        required: false
        type: string
        default: main

      tools:
        description: "Tools to run: shellcheck, shellfmt, or both."
        required: false
        type: string
        default: both

      scan-path:
        description: Repository-relative file or directory containing shell scripts.
        required: false
        type: string
        default: "."

      include-patterns:
        description: Comma-separated shell file patterns to include.
        required: false
        type: string
        default: "*.sh,*.bash,*.bats"

      exclude-paths:
        description: Comma-separated files or directories to exclude.
        required: false
        type: string
        default: ".git,node_modules,vendor,dist,build,.terraform"

      shellcheck-version:
        description: ShellCheck release version.
        required: false
        type: string
        default: "0.10.0"

      shellcheck-config-path:
        description: Optional repository-relative ShellCheck configuration path.
        required: false
        type: string
        default: ""

      use-default-shellcheck-config:
        description: Use the PipelineTemplates default ShellCheck configuration.
        required: false
        type: boolean
        default: true

      shellfmt-version:
        description: shellfmt release version.
        required: false
        type: string
        default: "3.10.0"

      shellfmt-config-path:
        description: Optional repository-relative shellfmt options-file path.
        required: false
        type: string
        default: ""

      use-default-shellfmt-config:
        description: Use the PipelineTemplates default shellfmt configuration.
        required: false
        type: boolean
        default: true

      fail-on-findings:
        description: Fail selected jobs after reports are uploaded when findings exist.
        required: false
        type: boolean
        default: true

      shellcheck-artifact-name:
        description: Artifact name passed to shellcheck.yml.
        required: false
        type: string
        default: shellcheck-results

      shellfmt-artifact-name:
        description: Artifact name passed to shellfmt.yml.
        required: false
        type: string
        default: shellfmt-results

      artifact-retention-days:
        description: Number of days to retain individual tool report artifacts.
        required: false
        type: number
        default: 30

permissions:
  contents: read

jobs:
  validate:
    name: Validate tool selection
    runs-on: ubuntu-latest

    steps:
      - name: Validate tools input
        shell: bash
        env:
          TOOLS: ${{ inputs.tools }}
        run: |
          set -euo pipefail

          case "${TOOLS}" in
            shellcheck|shellfmt|both)
              ;;
            *)
              echo "::error title=Invalid tool selection::tools must be shellcheck, shellfmt, or both."
              exit 1
              ;;
          esac

  shellcheck:
    name: ShellCheck
    needs: validate
    if: inputs.tools == 'shellcheck' || inputs.tools == 'both'
    uses: ./.github/workflows/shellcheck.yml
    with:
      pipelinetemplates-ref: ${{ inputs.pipelinetemplates-ref }}
      scan-path: ${{ inputs.scan-path }}
      shellcheck-version: ${{ inputs.shellcheck-version }}
      include-patterns: ${{ inputs.include-patterns }}
      exclude-paths: ${{ inputs.exclude-paths }}
      shellcheck-config-path: ${{ inputs.shellcheck-config-path }}
      use-default-shellcheck-config: ${{ inputs.use-default-shellcheck-config }}
      fail-on-findings: ${{ inputs.fail-on-findings }}
      artifact-name: ${{ inputs.shellcheck-artifact-name }}
      artifact-retention-days: ${{ inputs.artifact-retention-days }}

  shellfmt:
    name: shellfmt
    needs: validate
    if: inputs.tools == 'shellfmt' || inputs.tools == 'both'
    uses: ./.github/workflows/shellfmt.yml
    with:
      pipelinetemplates-ref: ${{ inputs.pipelinetemplates-ref }}
      scan-path: ${{ inputs.scan-path }}
      shellfmt-version: ${{ inputs.shellfmt-version }}
      include-patterns: ${{ inputs.include-patterns }}
      exclude-paths: ${{ inputs.exclude-paths }}
      shellfmt-config-path: ${{ inputs.shellfmt-config-path }}
      use-default-shellfmt-config: ${{ inputs.use-default-shellfmt-config }}
      fail-on-findings: ${{ inputs.fail-on-findings }}
      artifact-name: ${{ inputs.shellfmt-artifact-name }}
      artifact-retention-days: ${{ inputs.artifact-retention-days }}
