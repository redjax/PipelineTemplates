---
######################################################
# PR pipeline: preview changed components only.     #
######################################################

name: Pull Request steps

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/actions/**"
      - ".forgejo/actions/**"
      - "gitlab/components/**"
      - "concourse/components/**"
      - "woodpecker/components/**"
      - "**/VERSION"
      - "**/.bumpversion.toml"

permissions:
  contents: read

jobs:
  preview-components:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch refs
        run: git fetch origin main --tags --force

      - name: Install bump-my-version
        run: ./shared/scripts/bash/installers/install-bump-my-version.sh

      - name: Preview changed components
        env:
          DRY_RUN: "true"
        run: ./shared/scripts/bash/versioning/preview-components-release.sh

      - name: Preview tags
        run: ./shared/scripts/bash/versioning/git-tag-components.sh --dry-run
