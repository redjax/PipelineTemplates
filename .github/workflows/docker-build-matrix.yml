---
name: Docker Matrix Build

on:
  workflow_call:
    inputs:
      matrix:
        description: JSON array of Docker image build definitions
        required: true
        type: string

      publish:
        description: Publish images to their configured registries
        required: false
        default: false
        type: boolean

    secrets:
      registry-token:
        description: Registry authentication token
        required: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to registry
        if: inputs.publish && matrix.publish
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ matrix.registry }}
          username: ${{ matrix.registry_username || github.actor }}
          password: ${{ secrets.registry-token || github.token }}

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          tags: ${{ matrix.tags }}
          build-args: ${{ matrix.build_args }}
          labels: ${{ matrix.labels }}
          target: ${{ matrix.target }}
          pull: "${{ matrix.pull == true }}"
          no-cache: "${{ matrix.no_cache == true }}"
          cache-from: ${{ matrix.cache_from }}
          cache-to: ${{ matrix.cache_to }}
          secrets: ${{ matrix.secrets }}
          outputs: ${{ matrix.outputs }}
          annotations: ${{ matrix.annotations }}
          push: "${{ inputs.publish == true && matrix.publish == true }}"
          provenance: "${{ inputs.publish == true && matrix.publish == true }}"
          sbom: "${{ inputs.publish == true && matrix.publish == true }}"
