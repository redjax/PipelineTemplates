---
name: Publish Zensical Site to Cloudflare Pages

on:
  workflow_call:
    inputs:
      artifact-name:
        description: "Generated-site artifact to deploy."
        required: false
        type: string
        default: "zensical-site"

      run-id:
        description: "Workflow run ID containing artifact-name."
        required: true
        type: string

      cloudflare-pages-project:
        description: "Cloudflare Pages project name."
        required: true
        type: string

      cloudflare-pages-branch:
        description: "Cloudflare Pages production or preview branch."
        required: false
        type: string
        default: "main"

      wrangler-version:
        description: "Wrangler package version."
        required: false
        type: string
        # renovate: datasource=npm depName=wrangler
        default: "4.148.0"

      runner-image:
        description: "GitHub-hosted runner image or self-hosted runner label."
        required: false
        type: string
        default: "ubuntu-latest"

    secrets:
      cloudflare-api-token:
        required: true

      cloudflare-account-id:
        required: true

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy Cloudflare Pages
    runs-on: ${{ inputs.runner-image }}

    steps:
      - name: Download generated site artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}
          path: ./_published
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}

      - name: Verify downloaded site artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f ./_published/index.html

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # renovate: datasource=node-version depName=node versioning=node
          node-version: "24"

      - name: Install Wrangler
        shell: bash
        env:
          WRANGLER_VERSION: ${{ inputs.wrangler-version }}
        run: |
          set -Eeuo pipefail
          npm install --global "wrangler@${WRANGLER_VERSION}"
          wrangler --version

      - name: Ensure Cloudflare Pages project exists
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.cloudflare-api-token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.cloudflare-account-id }}
          CF_PAGES_PROJECT: ${{ inputs.cloudflare-pages-project }}
          CF_PAGES_BRANCH: ${{ inputs.cloudflare-pages-branch }}
        run: |
          set -Eeuo pipefail

          : "${CLOUDFLARE_API_TOKEN:?missing CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?missing CLOUDFLARE_ACCOUNT_ID}"
          : "${CF_PAGES_PROJECT:?missing CF_PAGES_PROJECT}"

          wrangler pages project create \
            "${CF_PAGES_PROJECT}" \
            --production-branch "${CF_PAGES_BRANCH}" \
            || true

      - name: Deploy generated site to Cloudflare Pages
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.cloudflare-api-token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.cloudflare-account-id }}
          CF_PAGES_PROJECT: ${{ inputs.cloudflare-pages-project }}
          CF_PAGES_BRANCH: ${{ inputs.cloudflare-pages-branch }}
        run: |
          set -Eeuo pipefail

          : "${CLOUDFLARE_API_TOKEN:?missing CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?missing CLOUDFLARE_ACCOUNT_ID}"
          : "${CF_PAGES_PROJECT:?missing CF_PAGES_PROJECT}"

          wrangler pages deploy ./_published \
            --project-name "${CF_PAGES_PROJECT}" \
            --branch "${CF_PAGES_BRANCH}"
