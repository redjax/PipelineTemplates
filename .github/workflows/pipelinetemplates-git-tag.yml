---
#########################################################
# Tag reconciliation pipeline                           #
#                                                       #
# Ensures all VERSION files have matching git tags.     #
#########################################################

name: Reconcile component tags

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch tags
        run: git fetch origin main --tags --force

      - name: Preview tag reconciliation
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: ./shared/scripts/bash/versioning/git-tag-components.sh --dry-run

      - name: Reconcile tags
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
        run: ./shared/scripts/bash/versioning/git-tag-components.sh --push
