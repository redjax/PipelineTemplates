---
############################################################
# The main orchestration pipeline for Hugo sites.          #
#                                                          #
# This pipeline supports versioned and unversioned sites.  #
# The calling repository passes repo-specific inputs that  #
# control which shared jobs run: version bumping, build,   #
# tag/release creation, and optional publishing.           #
#                                                          #
# The calling repository should use a thin workflow stub   #
# that invokes this central pipeline with its own inputs.  #
############################################################

name: Hugo Site Main Pipeline

on:
  workflow_call:
    inputs:
      site-root:
        type: string
        required: false
        default: "."
      versioned:
        type: boolean
        required: false
        default: true
      version-file:
        type: string
        required: false
        default: ".version"
      bump-script:
        type: string
        required: false
        default: "shared/scripts/ci-cd/hugo/bump-site-version.sh"
      bump-config:
        type: string
        required: false
        default: ".bumpversion.toml"
      artifact-name:
        type: string
        required: false
        default: "hugo-site"
      release-prefix:
        type: string
        required: false
        default: "site"
      publish-gh-pages:
        type: boolean
        required: false
        default: false
      publish-to-branch:
        required: false
        default: false
        type: boolean
      branch-name:
        required: false
        type: string
        default: gh-pages
      publish-cf-pages:
        required: false
        default: false
        type: boolean
      cloudflare-pages-branch:
        description: "Branch name reported to Cloudflare Pages."
        required: false
        type: string
        default: "main"
      cloudflare-pages-project:
        required: false
        default: ""
        type: string
      publish-netlify:
        required: false
        default: false
        type: boolean
      netlify-site-id:
        description: "Netlify site ID."
        required: false
        type: string
        default: ""
      netlify-branch:
        description: "Branch name reported to Netlify."
        required: false
        type: string
        default: "main"
      netlify-dir:
        description: "Directory to deploy to Netlify."
        required: false
        type: string
        default: "public"
      runner-image:
        type: string
        required: false
        default: ubuntu-latest
      templates-ref:
        description: "PipelineTemplates repository ref (branch, commit, tag, etc)."
        type: string
        required: false
        default: main
      hugo-build-flags:
        description: "Optional Hugo build command flags, i.e. --gc and --minify"
        type: string
        required: false
        default: "--gc --minify --enableGitInfo"
    secrets:
      release-bot-pat:
        required: true
      cloudflare-api-token:
        required: false
      cloudflare-account-id:
        required: false
      netlify-auth-token:
        required: false

permissions:
  contents: write
  actions: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  ## Trigger a bump if calling pipeline requests it and calling site is versioned.
  bump:
    if: ${{ github.event_name == 'push' && inputs.versioned }}
    uses: ./.github/workflows/hugo-version-bump.yml
    with:
      site-root: ${{ inputs.site-root }}
      bump-script: ${{ inputs.bump-script }}
      bump-config: ${{ inputs.bump-config }}
      version-file: ${{ inputs.version-file }}
      runner-image: ${{ inputs.runner-image }}
      templates-ref: ${{ inputs.templates-ref }}
    secrets:
      release-bot-pat: ${{ secrets.release-bot-pat }}

  ## Steps that apply to logical branches in the script, i.e.
  #  every step needs to checkout the code, so do it once here.
  prep-versioned:
    if: ${{ github.event_name == 'push' && inputs.versioned }}
    needs: [bump]
    runs-on: ${{ inputs.runner-image }}
    outputs:
      short-sha: ${{ steps.vars.outputs.short-sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compute short sha
        id: vars
        shell: bash
        run: echo "short-sha=$(git rev-parse --short=7 ${{ github.sha }})" >> "$GITHUB_OUTPUT"

  ## Run preparation step automatically on PR to main with changed hugo files
  prep-standard:
    if: ${{ !(github.event_name == 'push' && inputs.versioned) }}
    runs-on: ${{ inputs.runner-image }}
    outputs:
      short-sha: ${{ steps.vars.outputs.short-sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compute short sha
        id: vars
        shell: bash
        run: echo "short-sha=$(git rev-parse --short=7 ${{ github.sha }})" >> "$GITHUB_OUTPUT"

  ## Build step for the "versioned" lane
  build-versioned:
    if: ${{ github.event_name == 'push' && inputs.versioned }}
    needs: [prep-versioned]
    uses: ./.github/workflows/hugo-build.yml
    with:
      site-root: ${{ inputs.site-root }}
      artifact-name: ${{ inputs.artifact-name }}
      build-flags: ${{ inputs.hugo-build-flags }}
      runner-image: ${{ inputs.runner-image }}
    secrets: inherit

  ## Build step for the "standard"/automatic lane
  build-standard:
    if: ${{ !(github.event_name == 'push' && inputs.versioned) }}
    needs: [prep-standard]
    uses: ./.github/workflows/hugo-build.yml
    with:
      site-root: ${{ inputs.site-root }}
      artifact-name: ${{ inputs.artifact-name }}
      build-flags: ${{ inputs.hugo-build-flags }}
      runner-image: ${{ inputs.runner-image }}
    secrets: inherit

  ## Create tagged release in calling repository (site-v1.2.3).
  release-versioned:
    if: ${{ github.event_name == 'push' && inputs.versioned }}
    needs: [build-versioned, prep-versioned]
    uses: ./.github/workflows/hugo-gh-release.yml
    with:
      site-root: ${{ inputs.site-root }}
      versioned: ${{ inputs.versioned }}
      version-file: ${{ inputs.version-file }}
      artifact-name: ${{ inputs.artifact-name }}
      release-prefix: ${{ inputs.release-prefix }}
      build-run-id: ${{ github.run_id }}
      release-tag: ""
      runner-image: ${{ inputs.runner-image }}
    secrets:
      release-bot-pat: ${{ secrets.release-bot-pat }}

  ## Create tagged release in calling repository (site-<commit-hash>).
  release-standard:
    if: ${{ !(github.event_name == 'push' && inputs.versioned) }}
    needs: [build-standard, prep-standard]
    uses: ./.github/workflows/hugo-gh-release.yml
    with:
      site-root: ${{ inputs.site-root }}
      versioned: ${{ inputs.versioned }}
      version-file: ${{ inputs.version-file }}
      artifact-name: ${{ inputs.artifact-name }}
      release-prefix: ${{ inputs.release-prefix }}
      build-run-id: ${{ github.run_id }}
      release-tag: site-${{ needs.prep-standard.outputs.short-sha }}
      runner-image: ${{ inputs.runner-image }}
    secrets:
      release-bot-pat: ${{ secrets.release-bot-pat }}

  ## Publish to a branch in the consuming repository, i.e. gh-pages
  publish-branch-versioned:
    if: ${{ github.event_name == 'push' && inputs.versioned && inputs.publish-to-branch }}
    needs: [release-versioned]
    uses: ./.github/workflows/hugo-publish.yml
    with:
      target: branch
      branch-name: ${{ inputs.branch-name }}
      artifact-name: ${{ inputs.artifact-name }}
      run-id: ${{ github.run_id }}
      runner-image: ${{ inputs.runner-image }}

  publish-branch-standard:
    if: ${{ !(github.event_name == 'push' && inputs.versioned) && inputs.publish-to-branch }}
    needs: [release-standard]
    uses: ./.github/workflows/hugo-publish.yml
    with:
      target: branch
      branch-name: ${{ inputs.branch-name }}
      artifact-name: ${{ inputs.artifact-name }}
      run-id: ${{ github.run_id }}
      runner-image: ${{ inputs.runner-image }}

  ## Publish release archive to Github Pages
  publish-gh-pages-versioned:
    if: ${{ github.event_name == 'push' && inputs.versioned && inputs.publish-gh-pages }}
    needs: [release-versioned]
    uses: ./.github/workflows/hugo-publish.yml
    with:
      target: github-pages
      artifact-name: ${{ inputs.artifact-name }}
      run-id: ${{ github.run_id }}
      runner-image: ${{ inputs.runner-image }}

  publish-gh-pages-standard:
    if: ${{ !(github.event_name == 'push' && inputs.versioned) && inputs.publish-gh-pages }}
    needs: [release-standard]
    uses: ./.github/workflows/hugo-publish.yml
    with:
      target: github-pages
      artifact-name: ${{ inputs.artifact-name }}
      run-id: ${{ github.run_id }}
      runner-image: ${{ inputs.runner-image }}

  ## Publish release archive to Cloudflare Pages using the Wrangler CLI
  publish-cf-pages-versioned:
    if: ${{ github.event_name == 'push' && inputs.versioned && inputs.publish-cf-pages }}
    needs: [release-versioned]
    uses: ./.github/workflows/hugo-publish.yml
    with:
      target: cloudflare-pages
      cloudflare-pages-project: ${{ inputs.cloudflare-pages-project }}
      cloudflare-pages-branch: ${{ inputs.cloudflare-pages-branch }}
      artifact-name: ${{ inputs.artifact-name }}
      run-id: ${{ github.run_id }}
      runner-image: ${{ inputs.runner-image }}
    secrets:
      cloudflare-api-token: ${{ secrets.cloudflare-api-token }}
      cloudflare-account-id: ${{ secrets.cloudflare-account-id }}

  publish-cf-pages-standard:
    if: ${{ !(github.event_name == 'push' && inputs.versioned) && inputs.publish-cf-pages }}
    needs: [release-standard]
    uses: ./.github/workflows/hugo-publish.yml
    with:
      target: cloudflare-pages
      cloudflare-pages-project: ${{ inputs.cloudflare-pages-project }}
      cloudflare-pages-branch: ${{ inputs.cloudflare-pages-branch }}
      artifact-name: ${{ inputs.artifact-name }}
      run-id: ${{ github.run_id }}
      runner-image: ${{ inputs.runner-image }}
    secrets:
      cloudflare-api-token: ${{ secrets.cloudflare-api-token }}
      cloudflare-account-id: ${{ secrets.cloudflare-account-id }}

  publish-netlify-versioned:
    if: ${{ github.event_name == 'push' && inputs.versioned && inputs.publish-netlify }}
    needs: [release-versioned]
    uses: ./.github/workflows/hugo-publish.yml
    with:
      target: netlify
      artifact-name: ${{ inputs.artifact-name }}
      run-id: ${{ github.run_id }}
      netlify-site-id: ${{ inputs.netlify-site-id }}
      netlify-branch: ${{ inputs.netlify-branch }}
      netlify-dir: ${{ inputs.netlify-dir }}
      runner-image: ${{ inputs.runner-image }}
    secrets:
      netlify-auth-token: ${{ secrets.netlify-auth-token }}

  publish-netlify-standard:
    if: ${{ !(github.event_name == 'push' && inputs.versioned) && inputs.publish-netlify }}
    needs: [release-standard]
    uses: ./.github/workflows/hugo-publish.yml
    with:
      target: netlify
      artifact-name: ${{ inputs.artifact-name }}
      run-id: ${{ github.run_id }}
      netlify-site-id: ${{ inputs.netlify-site-id }}
      netlify-branch: ${{ inputs.netlify-branch }}
      netlify-dir: ${{ inputs.netlify-dir }}
      runner-image: ${{ inputs.runner-image }}
    secrets:
      netlify-auth-token: ${{ secrets.netlify-auth-token }}
