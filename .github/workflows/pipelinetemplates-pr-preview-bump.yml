---
######################################################
# PR pipeline: detect changed components and preview #
# releases without publishing tags.                  #
######################################################

name: PR checks - Bump & tag

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/actions/**"
      - "gitlab/components/**"
      - "concourse/components/**"
      - "woodpecker/components/**"
      - "**/VERSION"
      - "**/.bumpversion.toml"

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch main
        run: git fetch origin main --tags --force

      - name: Preview release
        run: |
          ./shared/scripts/bash/versioning/release-components.sh \
            --dry-run \
            --no-push \
            --no-commit

      - name: Preview tags
        run: |
          ./shared/scripts/bash/versioning/git-tag-components.sh \
            --dry-run
