---
#################################################
# Bump all 0.0.0 versioned components to 0.0.1. #
#################################################

name: Bump all 0.0.0 tags

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run - preview changes without committing/PR
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  reconcile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch refs
        run: git fetch origin main --tags --force

      - name: Install GitHub CLI
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gh
          fi

      - name: Run reconciliation script
        id: reconcile
        run: |
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            STATUS_LINE="$(./shared/scripts/bash/versioning/reconcile-zero-versions.sh --dry-run)"
          else
            STATUS_LINE="$(./shared/scripts/bash/versioning/reconcile-zero-versions.sh)"
          fi

          echo "Script status: $STATUS_LINE"

          STATUS="${STATUS_LINE#status=}"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Create branch and commit
        if: inputs.dry_run == false && steps.reconcile.outputs.status == 'bumped'
        id: commit
        run: |
          BRANCH_NAME="chore/reconcile-zero-versions"

          git checkout -b "$BRANCH_NAME"
          ## All bumped VERSION files are already changed in the working tree
          git status --short

          git add .
          git commit -m "chore(versioning): reconcile zero versions"

          git push -u origin "$BRANCH_NAME"

          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Open PR
        if: inputs.dry_run == false && steps.reconcile.outputs.status == 'bumped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "${{ steps.commit.outputs.branch_name }}" \
            --title "chore(versioning): reconcile zero versions" \
            --body "Found 0.0.0 versions and bump them to 0.0.1"

      - name: Merge PR
        if: inputs.dry_run == false && steps.reconcile.outputs.status == 'bumped'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge \
            --merge \
            --admin \
            --delete-branch \
            --subject "chore(versioning): reconcile zero versions" \
            --body "Automated merge of zero-version reconciliation."
