name: Bump all 0.0.0 tags

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run - preview changes without committing/PR
        required: false
        type: boolean
        default: true
      auto_merge:
        description: Auto-merge PR
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  reconcile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch refs
        run: git fetch origin main --tags --force

      - name: Install GitHub CLI
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gh
          fi

      - name: Run reconciliation script
        id: reconcile
        run: |
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            STATUS_LINE="$(./shared/scripts/bash/versioning/reconcile-zero-versions.sh --dry-run)"
          else
            STATUS_LINE="$(./shared/scripts/bash/versioning/reconcile-zero-versions.sh)"
          fi

          echo "Script status: $STATUS_LINE"

          STATUS="${STATUS_LINE#status=}"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Create branch and commit
        if: inputs.dry_run == false && steps.reconcile.outputs.status == 'bumped'
        id: commit
        run: |
          BRANCH_NAME="chore/reconcile-zero-versions"

          git fetch origin

          ## Always hard reset to the latest main
          git checkout main
          git reset --hard origin/main

          ## Always recreate the automation branch from main
          git checkout -B "$BRANCH_NAME"

          ## Script has already edited the VERSION files at this point
          git status --short

          git add .
          if git commit -m "chore(versioning): reconcile zero versions"; then
            ## Overwrite the remote branch history with this fresh snapshot
            git push --force-with-lease origin "$BRANCH_NAME"
            echo "changes_made=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes to commit."
            echo "changes_made=false" >> "$GITHUB_OUTPUT"
          fi

          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Check for existing PR
        if: >
          inputs.dry_run == false &&
          steps.reconcile.outputs.status == 'bumped' &&
          steps.commit.outputs.changes_made == 'true'
        id: check_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ steps.commit.outputs.branch_name }}"

          ## Returns the URL of the open PR, or empty string if none
          PR_URL="$(gh pr list \
            --head "$BRANCH_NAME" \
            --base main \
            --state open \
            --json url \
            --jq '.[0].url // empty')"

          if [[ -n "$PR_URL" ]]; then
            echo "Found existing PR: $PR_URL"
            echo "pr_exists=true" >> "$GITHUB_OUTPUT"
            echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          else
            echo "No existing PR found for $BRANCH_NAME -> main"
            echo "pr_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR
        if: >
          inputs.dry_run == false &&
          steps.reconcile.outputs.status == 'bumped' &&
          steps.commit.outputs.changes_made == 'true' &&
          steps.check_pr.outputs.pr_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "${{ steps.commit.outputs.branch_name }}" \
            --title "chore(versioning): reconcile zero versions" \
            --body "Automated zero-version reconciliation."

      - name: Merge PR
        if: >
          inputs.dry_run == false &&
          inputs.auto_merge == true &&
          steps.reconcile.outputs.status == 'bumped' &&
          steps.commit.outputs.changes_made == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ steps.commit.outputs.branch_name }}"

          ## Find the open PR number for this branch
          PR_NUMBER="$(gh pr list \
            --head "$BRANCH_NAME" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -z "$PR_NUMBER" ]]; then
            echo "No open PR found for $BRANCH_NAME; nothing to merge."
            exit 0
          fi

          echo "Merging PR #$PR_NUMBER for $BRANCH_NAME"

          gh pr merge "$PR_NUMBER" \
            --merge \
            --delete-branch \
            --subject "chore(versioning): reconcile zero versions" \
            --body "Automated merge of zero-version reconciliation."
