---
#################################################
# Bump all 0.0.0 versioned components to 0.0.1. #
#################################################

name: Bump all 0.0.0 tags

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run - preview changes without pushing
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  reconcile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch refs
        run: git fetch origin main --tags --force

      - name: Run reconciliation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            ./shared/scripts/bash/versioning/reconcile-zero-versions.sh --dry-run
          else
            ./shared/scripts/bash/versioning/reconcile-zero-versions.sh
          fi
