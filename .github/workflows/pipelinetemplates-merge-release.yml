---
################################################
# Release changed components and publish tags. #
################################################

name: Publish components

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch tags + base
        run: git fetch origin main --tags --force

      - name: Install bump tool
        run: ./shared/scripts/bash/installers/install-bump-my-version.sh

      - name: Set mode flags
        id: mode
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            echo "dry_run=true" >> $GITHUB_OUTPUT
          else
            echo "dry_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Release components
        if: steps.mode.outputs.dry_run == 'false'
        run: |
          ./shared/scripts/bash/versioning/release-components.sh

      - name: Commit VERSION changes
        if: steps.mode.outputs.dry_run == 'false'
        run: |
          git add "**/VERSION"
          git commit -m "chore(release): bump component versions" || true

      - name: Create tags
        if: steps.mode.outputs.dry_run == 'false'
        run: |
          ./shared/scripts/bash/versioning/git-tag-components.sh --push

      - name: Push changes
        if: steps.mode.outputs.dry_run == 'false'
        run: |
          git push origin HEAD --follow-tags

      - name: Dry run preview
        if: steps.mode.outputs.dry_run == 'true'
        run: |
          ./shared/scripts/bash/versioning/release-components.sh \
            --dry-run \
            --no-push \
            --no-commit

          ./shared/scripts/bash/versioning/git-tag-components.sh \
            --dry-run
