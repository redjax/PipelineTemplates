---
################################################
# Publish tags/releases for newly bumped       #
# component versions on merge to main.         #
################################################

name: Publish components

on:
  push:
    branches:
      - main
    paths:
      - ".github/actions/**"
      - "gitlab/components/**"
      - "concourse/components/**"
      - "woodpecker/components/**"
      - "**/VERSION"
      - "**/.bumpversion.toml"

  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview only
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch refs
        run: git fetch origin main --tags --force

      - name: Preview tags
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: ./shared/scripts/bash/versioning/git-tag-components.sh --dry-run

      - name: Create component tags
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
        run: ./shared/scripts/bash/versioning/git-tag-components.sh --push

      - name: Create GitHub releases
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./shared/scripts/bash/release/create-github-release.sh
