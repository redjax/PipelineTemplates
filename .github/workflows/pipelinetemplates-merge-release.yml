---
########################################################
# Publish tags/releases for newly bumped               #
# component versions on merge to main.                 #
#                                                      #
# This action requires a personal access token (PAT)   #
# with the following permissions:                      #
#   - Contents: Read and write                         #
#   - Pull requests: Read and write                    #
#                                                      #
# Create a token here:                                 #
#   https://github.com/settings/personal-access-tokens #
#                                                      #
# After creating a token, add it to the repository's   #
# Secrets and variables, under "Actions," in Settings. #
########################################################

name: Publish components

on:
  push:
    branches:
      - main
    paths:
      - ".github/actions/**"
      - ".forgejo/actions/**"
      - "gitlab/components/**"
      - "concourse/components/**"
      - "woodpecker/components/**"
      - "**/VERSION"
      - "**/.bumpversion.toml"

  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview only
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch refs
        run: git fetch origin main --tags --force

      - name: Create bump branch
        run: git checkout -b chore/bump-components

      - name: Install bump-my-version
        run: |
          python -m pip install --upgrade bump-my-version

      - name: Verify bump tool
        run: |
          which bump-my-version || true
          bump-my-version --version || true
          echo "$PATH"

      - name: Apply version bumps
        run: OUTPUT_FILE=.changed-components.txt ./shared/scripts/bash/versioning/release-components.sh

      - name: Commit bumps
        run: |
          if git diff --quiet; then
            echo "[INFO] No component bumps"
            exit 0
          fi

          git add "**/VERSION" "**/.bumpversion.toml"
          git commit -m "chore(release): bump component versions"

      - name: Merge bump branch
        env:
          PAT_REPO_WRITE: ${{ secrets.PAT_REPO_WRITE }}
        run: |
          git checkout main
          git merge --no-ff chore/bump-components
          git push "https://x-access-token:${PAT_REPO_WRITE}@github.com/${GITHUB_REPOSITORY}.git" main

      - name: Create component tags
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
        run: ./shared/scripts/bash/versioning/git-tag-components.sh --push --components-file .changed-components.txt
