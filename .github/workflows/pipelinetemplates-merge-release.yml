---
########################################################
# Publish tags/releases for newly bumped               #
# component versions on merge to main.                 #
#                                                      #
# This action requires a personal access token (PAT)   #
# with the following permissions:                      #
#   - Contents: Read and write                         #
#   - Pull requests: Read and write                    #
#                                                      #
# Create a token here:                                 #
#   https://github.com/settings/personal-access-tokens #
#                                                      #
# After creating a token, add it to the repository's   #
# Secrets and variables, under "Actions," in Settings. #
########################################################

name: Publish components

on:
  push:
    branches:
      - main
    paths:
      - ".github/actions/**"
      - ".forgejo/actions/**"
      - "gitlab/components/**"
      - "concourse/components/**"
      - "woodpecker/components/**"
      - "**/VERSION"
      - "**/.bumpversion.toml"

  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview only
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch refs
        run: git fetch origin main --tags --force

      - name: Install bump-my-version
        run: |
          python -m pip install --upgrade bump-my-version

      - name: Verify bump tool
        run: |
          which bump-my-version || true
          bump-my-version --version || true
          echo "$PATH"

      - name: Apply version bumps
        env:
          BASE_REF: ${{ github.event.before }}
          OUTPUT_FILE: .changed-components.txt
        run: |
          if [[ -z "${BASE_REF}" || "${BASE_REF}" == "0000000000000000000000000000000000000000" ]]; then
            echo "[ERROR] Missing valid BASE_REF for push event"
            exit 1
          fi

          ./shared/scripts/bash/versioning/release-components.sh

      - name: Create or update bump PR
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PAT_REPO_WRITE }}
          branch: chore/bump-ci-components
          base: main
          delete-branch: true
          title: "chore(release): bump component versions"
          commit-message: "chore(release): bump component versions"
          body: |
            Automated version bumps for changed components.
          add-paths: |
            **/VERSION
            **/.bumpversion.toml

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.PAT_REPO_WRITE }}
        run: |
          gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --auto --merge

      - name: Dry run summary
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: |
          echo "[DRY RUN] Dry run enabled; no PR created."
