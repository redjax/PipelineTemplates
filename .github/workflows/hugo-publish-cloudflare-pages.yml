---
##################################################
# Deploy a Hugo site to Cloudflare Pages         #
#                                                #
# The calling repository must set the            #
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_API_KEY    #
# secrets in the repository's settings on Github #
##################################################

name: Hugo Publish Cloudflare Pages

on:
  workflow_call:
    inputs:
      run-id:
        description: "Build workflow run ID to download the artifact from."
        required: true
        type: string

      artifact-name:
        description: "Name of the build artifact to download."
        required: false
        type: string
        default: "hugo-site"

      cloudflare-pages-project:
        description: "Cloudflare Pages project name."
        required: false
        type: string
        default: ""

      cloudflare-pages-branch:
        description: "Branch name reported to Cloudflare Pages."
        required: false
        type: string
        default: "main"

      cloudflare-pages-directory:
        description: "Directory to deploy to Cloudflare Pages."
        required: false
        type: string
        default: "public"

      dry-run:
        description: "If true, do not deploy."
        required: false
        type: boolean
        default: false

    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Preflight Cloudflare secrets
        id: preflight
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -Eeuo pipefail
          if [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "[INFO] Cloudflare secrets missing; skipping Cloudflare Pages publish."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download build artifact
        if: ${{ !inputs.dry-run && steps.preflight.outputs.enabled == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}
          path: ./_published

      - name: Setup Node
        if: ${{ !inputs.dry-run && steps.preflight.outputs.enabled == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Wrangler
        if: ${{ !inputs.dry-run && steps.preflight.outputs.enabled == 'true' }}
        shell: bash
        run: npm install --save-dev wrangler@latest

      - name: Detect deploy directory
        if: ${{ !inputs.dry-run && steps.preflight.outputs.enabled == 'true' }}
        id: detect
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -d "./_published/${{ inputs.cloudflare-pages-directory }}" ]]; then
            echo "deploy-dir=./_published/${{ inputs.cloudflare-pages-directory }}" >> "$GITHUB_OUTPUT"
          elif [[ -d "./_published" ]]; then
            echo "deploy-dir=./_published" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No deploy directory found in artifact"
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        if: ${{ !inputs.dry-run && steps.preflight.outputs.enabled == 'true' }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ inputs.cloudflare-pages-project }}
          CF_PAGES_BRANCH: ${{ inputs.cloudflare-pages-branch }}
          DEPLOY_DIR: ${{ steps.detect.outputs.deploy-dir }}
        run: |
          set -Eeuo pipefail

          : "${CLOUDFLARE_API_TOKEN:?missing CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?missing CLOUDFLARE_ACCOUNT_ID}"
          : "${CF_PAGES_PROJECT:?missing CF_PAGES_PROJECT}"

          if ! npx wrangler pages deploy "${DEPLOY_DIR}" \
            --project-name "${CF_PAGES_PROJECT}" \
            --branch "${CF_PAGES_BRANCH}"; then
            echo "[INFO] Initial deploy failed; attempting one-time project creation."

            npx wrangler pages project create "${CF_PAGES_PROJECT}" --production-branch "${CF_PAGES_BRANCH}" || true
            npx wrangler pages deploy "${DEPLOY_DIR}" \
              --project-name "${CF_PAGES_PROJECT}" \
              --branch "${CF_PAGES_BRANCH}"
          fi
