---
################################################################################
# Reusable workflow to publish a Hugo site.                                    #
#                                                                              #
# This workflow does not build a site, only publishes.                         #
# It accepts multiple targets:                                                 #
#   - A branch in the git repository                                           #
#   - GitHub Pages                                                             #
#   - Cloudflare Pages                                                         #
#                                                                              #
# Usage:                                                                       #
#   jobs:                                                                      #
#     publish:                                                                 #
#       uses: redjax/pipelinetemplates/.github/workflows/hugo-publish.yml@main #
#       with:                                                                  #
#         target: github-pages                                                 #
#         artifact-name: hugo-site                                             #
#                                                                              #
# Notes:                                                                       #
#   - This workflow expects the Hugo build output to                           #
#     have already been uploaded as a workflow artifact                        #
#     by a previous job or workflow step.                                      #
#   - For branch publishing, the target branch will be                         #
#     force-updated with the contents of the artifact.                         #
#   - For GitHub Pages, this workflow uses the official                        #
#     Pages artifact & deploy flow.                                            #
#   - For Cloudflare Pages, this workflow deploys via                          #
#     Wrangler direct upload.                                                  #
################################################################################

name: Hugo Publish Site

on:
  workflow_call:
    inputs:
      target:
        description: "Publish target: branch, github-pages, or cloudflare-pages."
        required: true
        type: string

      run-id:
        description: "Build workflow run ID to download the artifact from."
        required: true
        type: string

      artifact-name:
        description: "Name of the build artifact to download."
        required: false
        type: string
        default: "hugo-site"

      branch-name:
        description: "Target branch for branch deploys."
        required: false
        type: string
        default: "gh-pages"

      commit-message:
        description: "Commit message for branch deploys."
        required: false
        type: string
        default: "Deploy Hugo site"

      cloudflare-pages-project:
        description: "Cloudflare Pages project name."
        required: false
        type: string
        default: ""

      cloudflare-pages-branch:
        description: "Branch name reported to Cloudflare Pages."
        required: false
        type: string
        default: ""

      cloudflare-pages-directory:
        description: "Directory to deploy to Cloudflare Pages."
        required: false
        type: string
        default: "public"

      dry-run:
        description: "If true, do not push/deploy."
        required: false
        type: boolean
        default: false

    secrets:
      cloudflare-api-token:
        required: false

      cloudflare-account-id:
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  branch:
    if: ${{ inputs.target == 'branch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}
          path: ./_published

      - name: Publish to branch
        shell: bash
        working-directory: ./_published
        env:
          BRANCH_NAME: ${{ inputs.branch-name }}
          COMMIT_MESSAGE: ${{ inputs.commit-message }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -Eeuo pipefail

          if [[ "${DRY_RUN}" == "true" ]]; then
            echo "[INFO] Dry run enabled; skipping branch publish."
            exit 0
          fi

          git init
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch origin "${BRANCH_NAME}" || true
          git checkout -B "${BRANCH_NAME}"

          git add .
          if git diff --cached --quiet; then
            echo "[INFO] No changes to publish."
            exit 0
          fi

          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git commit -m "${COMMIT_MESSAGE}"
          git push origin "${BRANCH_NAME}" --force

  github-pages:
    if: ${{ inputs.target == 'github-pages' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}
          path: ./_published

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_published

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  cloudflare-pages:
    if: ${{ inputs.target == 'cloudflare-pages' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}
          path: ./_published

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Wrangler
        shell: bash
        run: npm install --global wrangler

      - name: Deploy to Cloudflare Pages
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.cloudflare-api-token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.cloudflare-account-id }}
          CF_PAGES_PROJECT: ${{ inputs.cloudflare-pages-project }}
          CF_PAGES_BRANCH: ${{ inputs.cloudflare-pages-branch }}
        run: |
          set -Eeuo pipefail
          wrangler pages deploy "./_published/${{ inputs.cloudflare-pages-directory }}" \
            --project-name "${CF_PAGES_PROJECT}" \
            --branch "${CF_PAGES_BRANCH}"
