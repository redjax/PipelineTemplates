---
################################################################################
# Reusable workflow to publish a Hugo site.                                    #
#                                                                              #
# This workflow does not build a site, only publishes.                         #
# It accepts multiple targets:                                                 #
#   - A branch in the git repository                                           #
#   - GitHub Pages                                                             #
#   - Cloudflare Pages                                                         #
#   - GitHub Release                                                           #
#                                                                              #
# Usage:                                                                       #
#   jobs:                                                                      #
#     publish:                                                                 #
#       uses: redjax/pipelinetemplates/.github/workflows/hugo-publish.yml@main #
#       with:                                                                  #
#         target: github-pages                                                 #
#         artifact-name: hugo-site                                             #
#                                                                              #
# Notes:                                                                       #
#   - This workflow expects the Hugo build output to                           #
#     have already been uploaded as a workflow artifact                        #
#     by a previous job or workflow step.                                      #
#   - For branch publishing, the target branch will be                         #
#     force-updated with the contents of the artifact.                         #
#   - For GitHub Pages, this workflow uses the official                        #
#     Pages artifact & deploy flow.                                            #
#   - For Cloudflare Pages, this workflow deploys via                          #
#     Wrangler direct upload.                                                  #
################################################################################

name: Hugo Publish Site

on:
  workflow_call:
    inputs:
      target:
        description: "Publish target: branch, github-pages, cloudflare-pages, or github-release."
        required: true
        type: string

      run-id:
        description: "Build workflow run ID to download the artifact from. Leave blank for later release-based flows."
        required: false
        type: string
        default: ""

      artifact-name:
        description: "Name of the build artifact to download."
        required: false
        type: string
        default: "hugo-site"

      branch-name:
        description: "Target branch for branch deploys."
        required: false
        type: string
        default: "gh-pages"

      commit-message:
        description: "Commit message for branch deploys."
        required: false
        type: string
        default: "Deploy Hugo site"

      cloudflare-pages-project:
        description: "Cloudflare Pages project name."
        required: false
        type: string
        default: ""

      cloudflare-pages-branch:
        description: "Branch name reported to Cloudflare Pages."
        required: false
        type: string
        default: "main"

      cloudflare-pages-directory:
        description: "Directory to deploy to Cloudflare Pages."
        required: false
        type: string
        default: "public"

      netlify-site-id:
        description: "Netlify site ID."
        required: false
        type: string
        default: ""

      netlify-branch:
        description: "Branch name reported to Netlify."
        required: false
        type: string
        default: "main"

      netlify-dir:
        description: "Directory to deploy to Netlify."
        required: false
        type: string
        default: "public"

      release-name:
        description: "GitHub release name."
        required: false
        type: string
        default: ""

      release-version:
        description: "Optional version string used to build a tag and archive names."
        required: false
        type: string
        default: ""

      release-tag:
        description: "Optional explicit Git tag to use for the GitHub release."
        required: false
        type: string
        default: ""

      dry-run:
        description: "If true, do not push/deploy."
        required: false
        type: boolean
        default: false

      runner-image:
        description: 'Runner image or label list. Default: "ubuntu-latest"'
        required: false
        type: string
        default: '"ubuntu-latest"'

    secrets:
      cloudflare-api-token:
        required: false

      cloudflare-account-id:
        required: false

      netlify-auth-token:
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  ## Publish to a branch in the repository (i.e. gh-pages)
  branch:
    if: ${{ inputs.target == 'branch' }}
    runs-on: ${{ inputs.runner-image }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}
          path: ./_published

      - name: Publish to branch
        shell: bash
        working-directory: ./_published
        env:
          BRANCH_NAME: ${{ inputs.branch-name }}
          COMMIT_MESSAGE: ${{ inputs.commit-message }}
          DRY_RUN: ${{ inputs.dry-run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          if [[ "${DRY_RUN}" == "true" ]]; then
            echo "[INFO] Dry run enabled; skipping branch publish."
            exit 0
          fi

          git init
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git fetch origin "${BRANCH_NAME}" || true
          git checkout -B "${BRANCH_NAME}"

          git add .
          if git diff --cached --quiet; then
            echo "[INFO] No changes to publish."
            exit 0
          fi

          git commit -m "${COMMIT_MESSAGE}"
          git push origin "${BRANCH_NAME}" --force

  ## Publish to Github Pages from release artifact.
  #  Assumes you have disabled automatic publishing
  #  from a branch in the calling repository.
  github-pages:
    if: ${{ inputs.target == 'github-pages' }}
    runs-on: ${{ inputs.runner-image }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}
          path: ./_published

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_published

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  ## Publish to Cloudflare Pages.
  #  Assumes you have set up a bare Cloudflare Worker,
  #  or have disabled publishin on changes to a specific branch.
  #
  #  Uses the Wrangler CLI to push changes:
  #    https://developers.cloudflare.com/workers/wrangler/
  cloudflare-pages:
    if: ${{ inputs.target == 'cloudflare-pages' }}
    runs-on: ${{ inputs.runner-image }}
    steps:
      - name: Cloudflare Pages dry-run notice
        if: ${{ inputs.dry-run }}
        run: echo "[DRY RUN] Would run Cloudflare Pages deploy jobs."

      - name: Download build artifact
        if: ${{ !inputs.dry-run }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}
          path: ./_published

      - name: Setup Node
        if: ${{ !inputs.dry-run }}
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Wrangler
        if: ${{ !inputs.dry-run }}
        shell: bash
        run: npm install --save-dev wrangler@latest

      - name: Ensure Cloudflare Pages project exists
        if: ${{ !inputs.dry-run }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.cloudflare-api-token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.cloudflare-account-id }}
          CF_PAGES_PROJECT: ${{ inputs.cloudflare-pages-project }}
          CF_PAGES_BRANCH: ${{ inputs.cloudflare-pages-branch }}
        run: |
          set -Eeuo pipefail

          : "${CLOUDFLARE_API_TOKEN:?missing CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?missing CLOUDFLARE_ACCOUNT_ID}"
          : "${CF_PAGES_PROJECT:?missing CF_PAGES_PROJECT}"

          npx wrangler pages project create "${CF_PAGES_PROJECT}" --production-branch "${CF_PAGES_BRANCH}" || true

      ## Deploy code from a specific branch to Cloudflare Pages (default: main).
      - name: Deploy to Cloudflare Pages
        if: ${{ !inputs.dry-run }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.cloudflare-api-token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.cloudflare-account-id }}
          CF_PAGES_PROJECT: ${{ inputs.cloudflare-pages-project }}
          CF_PAGES_BRANCH: ${{ inputs.cloudflare-pages-branch }}
        run: |
          set -Eeuo pipefail

          : "${CLOUDFLARE_API_TOKEN:?missing CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?missing CLOUDFLARE_ACCOUNT_ID}"
          : "${CF_PAGES_PROJECT:?missing CF_PAGES_PROJECT}"

          npx wrangler pages deploy "./_published" \
            --project-name "${CF_PAGES_PROJECT}" \
            --branch "${CF_PAGES_BRANCH}"

  ## Publish to Github release.
  #  For versioned repositories, the release name
  #  will be site-v<version-number>, with release assets named
  #  i.e. site-v1.2.3.tar.gz and .zip.
  #
  #  For un-versioned repositories, the release name
  #  will be site-<commit-shorthash>, with release assets named
  #  i.e. site-acf4b9a.tar.gz and .zip.
  github-release:
    if: ${{ inputs.target == 'github-release' }}
    runs-on: ${{ inputs.runner-image }}
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}
          path: ./_published

      ## Set tag and release name as pipeline outputs
      - name: Prepare release metadata
        id: rel
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release-version }}
          RELEASE_NAME: ${{ inputs.release-name }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          set -Eeuo pipefail

          if [[ -n "${RELEASE_TAG}" ]]; then
            TAG="${RELEASE_TAG}"
          elif [[ -n "${RELEASE_VERSION}" ]]; then
            TAG="site-v${RELEASE_VERSION}"
          else
            TAG="site"
          fi

          if [[ -n "${RELEASE_NAME}" ]]; then
            NAME="${RELEASE_NAME}"
          elif [[ -n "${RELEASE_VERSION}" ]]; then
            NAME="Site v${RELEASE_VERSION}"
          else
            NAME="site"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      ## Find archived site (.tar.gz and .zip)
      - name: Select release assets
        id: assets
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob

          tar_files=(./_published/*.tar.gz)
          zip_files=(./_published/*.zip)

          if (( ${#tar_files[@]} > 0 )); then
            echo "[INFO] tar.gz archive(s) found; releasing tar.gz only."
            printf '%s\n' "${tar_files[@]}" > /tmp/release-assets.txt

          elif (( ${#zip_files[@]} > 0 )); then
            echo "[INFO] zip archive(s) found; releasing zip only."
            printf '%s\n' "${zip_files[@]}" > /tmp/release-assets.txt

          else
            echo "[INFO] No archives found; creating fallback tar.gz from raw published contents."

            mkdir -p ./_release
            
            tar -C ./_published -czf ./_release/site.tar.gz .
            echo "./_release/site.tar.gz" > /tmp/release-assets.txt
          fi

          {
            echo 'files<<EOF'
            cat /tmp/release-assets.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          files: ${{ steps.assets.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

  ## Publish to Netlify
  netlify:
    if: ${{ inputs.target == 'netlify' }}
    runs-on: ${{ inputs.runner-image }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}
          path: ./_published

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Netlify CLI
        shell: bash
        run: npm install -g netlify-cli

      - name: Deploy to Netlify
        shell: bash
        working-directory: ./_published
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.netlify-auth-token }}
          NETLIFY_SITE_ID: ${{ inputs.netlify-site-id }}
          NETLIFY_BRANCH: ${{ inputs.netlify-branch }}
          NETLIFY_DIR: ${{ inputs.netlify-dir }}
        run: |
          set -Eeuo pipefail

          : "${NETLIFY_AUTH_TOKEN:?missing NETLIFY_AUTH_TOKEN}"
          : "${NETLIFY_SITE_ID:?missing NETLIFY_SITE_ID}"

          netlify deploy \
            --site "${NETLIFY_SITE_ID}" \
            --auth "${NETLIFY_AUTH_TOKEN}" \
            --dir "${NETLIFY_DIR}" \
            --prod \
            --message "Deploy ${GITHUB_SHA:0:7} on ${NETLIFY_BRANCH}"
