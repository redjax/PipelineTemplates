---
name: Docker Build

on:
  workflow_call:
    inputs:
      context:
        description: Docker build context
        required: false
        type: string
        default: .

      dockerfile:
        description: Dockerfile path
        required: false
        type: string
        default: Dockerfile

      tags:
        description: Newline-delimited image tags
        required: true
        type: string

      platforms:
        description: Target platforms (i.e. linux/amd64,linux/arm64,windows/amd64,windows/arm64,darwin/amd64,darwin/arm64)
        required: false
        type: string
        default: linux/amd64

      build-args:
        description: Newline-delimited Docker build arguments
        required: false
        type: string
        default: ""

      labels:
        description: Newline-delimited Docker labels
        required: false
        type: string
        default: ""

      target:
        description: Optional Dockerfile build target
        required: false
        type: string
        default: ""

      pull:
        description: Always pull base images
        required: false
        type: boolean
        default: false

      no-cache:
        description: Disable Docker build cache
        required: false
        type: boolean
        default: false

      cache-from:
        description: Newline-delimited BuildKit cache sources
        required: false
        type: string
        default: type=gha

      cache-to:
        description: Newline-delimited BuildKit cache destinations
        required: false
        type: string
        default: type=gha,mode=max

      secrets:
        description: Newline-delimited BuildKit secret specifications
        required: false
        type: string
        default: ""

      outputs:
        description: Newline-delimited BuildKit output specifications
        required: false
        type: string
        default: ""

      annotations:
        description: Newline-delimited OCI annotations
        required: false
        type: string
        default: ""

      publish:
        description: Push the image
        required: false
        type: boolean
        default: false

      registry:
        description: Registry hostname
        required: false
        type: string
        default: ghcr.io

      registry-username:
        description: Registry username
        required: false
        type: string
        default: ""

    secrets:
      registry-token:
        description: Registry authentication token
        required: false

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to registry
        if: inputs.publish
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.registry-username || github.actor }}
          password: ${{ secrets.registry-token || github.token }}

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          tags: ${{ inputs.tags }}
          build-args: ${{ inputs.build-args }}
          labels: ${{ inputs.labels }}
          target: ${{ inputs.target }}
          pull: ${{ inputs.pull }}
          no-cache: ${{ inputs.no-cache }}
          cache-from: ${{ inputs.cache-from }}
          cache-to: ${{ inputs.cache-to }}
          secrets: ${{ inputs.secrets }}
          outputs: ${{ inputs.outputs }}
          annotations: ${{ inputs.annotations }}
          push: ${{ inputs.publish }}
          provenance: ${{ inputs.publish }}
          sbom: ${{ inputs.publish }}
