---
######################################################################
# Hugo version bump pipeline.                                        #
#                                                                    #
# This pipeline handles version bumps for Hugo repositories that use #
# bumpmyversion / version-file-based versioning.                     #
#                                                                    #
# It is intended to run in the calling repository, not in            #
# pipelinetemplates.                                                 #
######################################################################

name: Hugo version bump

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      source-dir:
        description: "Path to the Hugo project root."
        required: false
        type: string
        default: "."

      version-file:
        description: "Path to the repo's version file."
        required: false
        type: string
        default: ".version"

      bumpversion-file:
        description: "Path to the bumpversion config file."
        required: false
        type: string
        default: ".bumpversion.toml"

      extra-paths:
        description: "Optional newline-delimited extra path globs to watch."
        required: false
        type: string
        default: ""

      force:
        description: "Force a version bump even if changed-file detection finds nothing."
        required: false
        type: boolean
        default: false

      bump-command:
        description: "Command to run for version bumping."
        required: false
        type: string
        default: "bump-my-version bump patch"

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      SOURCE_DIR: ${{ inputs.source-dir || '.' }}
      VERSION_FILE: ${{ inputs.version-file || '.version' }}
      BUMPVERSION_FILE: ${{ inputs.bumpversion-file || '.bumpversion.toml' }}
      EXTRA_PATHS: ${{ inputs.extra-paths || '' }}
      FORCE: ${{ inputs.force || false }}
      BUMP_COMMAND: ${{ inputs.bump-command || 'bump-my-version bump patch' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect versioning files
        id: detect
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f "${VERSION_FILE}" && -f "${BUMPVERSION_FILE}" ]]; then
            echo "versioned=true" >> "$GITHUB_OUTPUT"
          else
            echo "versioned=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve watched paths
        id: watch
        shell: bash
        run: |
          set -Eeuo pipefail
          base_paths=(
            "${SOURCE_DIR}/archetypes/**"
            "${SOURCE_DIR}/content/**"
            "${SOURCE_DIR}/data/**"
            "${SOURCE_DIR}/i18n/**"
            "${SOURCE_DIR}/static/**"
            "${SOURCE_DIR}/hugo.yml"
            "${SOURCE_DIR}/hugo.yaml"
            "${SOURCE_DIR}/hugo.toml"
            "${SOURCE_DIR}/go.mod"
            "${SOURCE_DIR}/go.sum"
            "${SOURCE_DIR}/config.toml"
            "${SOURCE_DIR}/config.yaml"
            "${SOURCE_DIR}/config.yml"
          )

          {
            for p in "${base_paths[@]}"; do echo "$p"; done
            if [[ -n "${EXTRA_PATHS}" ]]; then
              printf '%s\n' "${EXTRA_PATHS}"
            fi
          } | awk 'NF' > /tmp/watched-paths.txt

      - name: Detect relevant changes
        id: changes
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "${FORCE}" == "true" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          after="${{ github.sha }}"

          git diff --name-only "${before}" "${after}" > /tmp/changed-files.txt || true
          if [[ ! -s /tmp/changed-files.txt ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path
          import fnmatch

          changed = [x.strip() for x in Path("/tmp/changed-files.txt").read_text().splitlines() if x.strip()]
          watched = [x.strip() for x in Path("/tmp/watched-paths.txt").read_text().splitlines() if x.strip()]

          matched = False
          for c in changed:
            for w in watched:
              if fnmatch.fnmatch(c, w):
                matched = True
                break
            if matched:
              break

          Path("/tmp/changed-result.txt").write_text("true" if matched else "false")
          PY

          echo "changed=$(cat /tmp/changed-result.txt)" >> "$GITHUB_OUTPUT"

      - name: Stop if unversioned or unchanged
        if: ${{ steps.detect.outputs.versioned != 'true' || steps.changes.outputs.changed != 'true' }}
        run: |
          if [[ "${{ steps.detect.outputs.versioned }}" != "true" ]]; then
            echo "[INFO] Repository is not versioned; skipping version bump."
          else
            echo "[INFO] No relevant changes detected; skipping version bump."
          fi

      - name: Bump version
        if: ${{ steps.detect.outputs.versioned == 'true' && steps.changes.outputs.changed == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ${BUMP_COMMAND}

      - name: Create bump branch
        if: ${{ steps.detect.outputs.versioned == 'true' && steps.changes.outputs.changed == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          branch="hugo-version-bump-${GITHUB_RUN_ID}"
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git checkout -b "${branch}"
          git add "${VERSION_FILE}" "${BUMPVERSION_FILE}" || true
          if git diff --cached --quiet; then
            echo "[INFO] No version changes to commit."
            exit 0
          fi
          git commit -m "ci: bump version"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git "${branch}"

      - name: Open pull request
        if: ${{ steps.detect.outputs.versioned == 'true' && steps.changes.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          branch="hugo-version-bump-${GITHUB_RUN_ID}"
          gh pr create \
            --base main \
            --head "${branch}" \
            --title "ci: bump version" \
            --body "Automated version bump."

      - name: Auto-merge pull request
        if: ${{ steps.detect.outputs.versioned == 'true' && steps.changes.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          pr_number="$(gh pr list --head "hugo-version-bump-${GITHUB_RUN_ID}" --json number --jq '.[0].number')"
          if [[ -n "${pr_number}" ]]; then
            gh pr merge "${pr_number}" --auto --merge
          fi
