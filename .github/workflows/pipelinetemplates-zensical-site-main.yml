---
################################################################################
# Build, release, and publish PipelineTemplates Zensical documentation         #
#                                                                              #
# This repository-local caller builds docs/ using the UV project in docs-site/ #
# and the repository-root zensical.toml configuration.                         #
#                                                                              #
# This site is intentionally unversioned. Every qualifying build produces a    #
# short-SHA release tag, for example:                                          #
#   pipelinetemplates-docs-a1b2c3d                                             #
#                                                                              #
# The generated artifact is published to both gh-pages and GitHub Pages.       #
################################################################################

name: PipelineTemplates Zensical Site Main

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "zensical.toml"
      - "docs-site/pyproject.toml"
      - "docs-site/uv.lock"

  workflow_dispatch:
    inputs:
      publish-targets:
        description: 'JSON array of targets. Default: ["branch","github-pages"].'
        required: false
        type: string
        default: '["branch","github-pages"]'

      branch-name:
        description: "Deployment branch used only when publish-targets includes branch."
        required: false
        type: string
        default: "gh-pages"

      branch-commit-message:
        description: "Commit message used when publishing to the deployment branch."
        required: false
        type: string
        default: "docs: publish PipelineTemplates Zensical site"

      cloudflare-pages-project:
        description: "Cloudflare Pages project name. Required only when publish-targets includes cloudflare-pages."
        required: false
        type: string
        default: ""

      cloudflare-pages-branch:
        description: "Cloudflare Pages production or preview branch."
        required: false
        type: string
        default: "main"

      cloudflare-wrangler-version:
        description: "Pinned Wrangler version used for Cloudflare Pages deployment."
        required: false
        type: string
        # renovate: datasource=npm depName=wrangler
        default: "4.148.0"

      runner-image:
        description: "GitHub-hosted runner image or self-hosted runner label."
        required: false
        type: string
        default: "ubuntu-latest"

      strict:
        description: "Fail when Zensical validation reports warnings."
        required: false
        type: boolean
        default: false

      use-cache:
        description: "Enable UV dependency cache restore/save."
        required: false
        type: boolean
        default: true

      clean:
        description: "Remove generated output before building."
        required: false
        type: boolean
        default: true

      create-github-release:
        description: "Create a GitHub Release with .tar.gz and .zip static-site assets."
        required: false
        type: boolean
        default: true

      debug-state:
        description: "Print resolved paths, configuration, tool versions, and output diagnostics."
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: pipelinetemplates-zensical-site-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pipeline:
    name: Build, Release, and Publish PipelineTemplates Documentation
    uses: ./.github/workflows/zensical-site-main.yml
    with:
      ## PipelineTemplates Python/UV/Zensical layout.
      # renovate: datasource=python-version depName=python versioning=pep440
      python-version: "3.14.8"
      working-directory: "."
      python-project-dir: "docs-site"
      zensical-config: "zensical.toml"
      docs-dir: "docs"
      output-dir: "docs-site/site"

      ## PipelineTemplates documentation is not bump-my-version versioned.
      versioned: false

      ## Build artifact.
      artifact-name: "pipelinetemplates-zensical-site"
      artifact-retention-days: 7
      artifact-if-no-files-found: "error"

      ## Standard/non-versioned tags and releases use pipelinetemplates-docs-<short-sha>
      release-prefix: "pipelinetemplates-docs"

      ## Default to publishing the same generated artifact to both targets.
      publish-targets: >-
        ${{
          github.event_name == 'workflow_dispatch' &&
          inputs.publish-targets ||
          '["branch","github-pages"]'
        }}

      branch-name: >-
        ${{
          github.event_name == 'workflow_dispatch' &&
          inputs.branch-name ||
          'gh-pages'
        }}

      branch-commit-message: >-
        ${{
          github.event_name == 'workflow_dispatch' &&
          inputs.branch-commit-message ||
          'docs: publish PipelineTemplates Zensical site'
        }}

      ## Available only when a manual run includes cloudflare-pages in
      #  publish-targets. Automatic runs leave the project unset.
      cloudflare-pages-project: >-
        ${{
          github.event_name == 'workflow_dispatch' &&
          inputs.cloudflare-pages-project ||
          ''
        }}

      cloudflare-pages-branch: >-
        ${{
          github.event_name == 'workflow_dispatch' &&
          inputs.cloudflare-pages-branch ||
          'main'
        }}

      cloudflare-wrangler-version: >-
        ${{
          github.event_name == 'workflow_dispatch' &&
          inputs.cloudflare-wrangler-version ||
          '4.51.0'
        }}

      runner-image: >-
        ${{
          github.event_name == 'workflow_dispatch' &&
          inputs.runner-image ||
          'ubuntu-latest'
        }}

      strict: >-
        ${{
          github.event_name == 'workflow_dispatch' &&
          inputs.strict ||
          false
        }}

      clean: >-
        ${{
          github.event_name == 'workflow_dispatch' &&
          inputs.clean ||
          true
        }}

      use-cache: >-
        ${{
          github.event_name == 'workflow_dispatch' &&
          inputs.use-cache ||
          true
        }}

      cache-key-suffix: "pipelinetemplates-zensical-docs"

      ## The outer push path filter chooses qualifying automatic builds.
      #  Always build in the inner reusable workflow once invoked.
      check-changed: false

      create-github-release: >-
        ${{
          github.event_name == 'workflow_dispatch' &&
          inputs.create-github-release ||
          true
        }}

      checkout-ref: ${{ github.sha }}

      debug-state: >-
        ${{
          github.event_name == 'workflow_dispatch' &&
          inputs.debug-state ||
          false
        }}

    secrets:
      cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
