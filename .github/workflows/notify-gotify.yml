---
##########################################
# Send a notification to a Gotify server #
##########################################

name: Gotify Notification

on:
  workflow_call:
    inputs:
      gotify-url:
        description: "Base URL of the Gotify server"
        required: true
        type: string

      title:
        description: "Notification title"
        required: false
        type: string
        default: ""

      message:
        description: "Notification message"
        required: true
        type: string

      priority:
        description: "Gotify priority"
        required: false
        type: number
        default: 0

      use-json:
        description: "Use application/json payload instead of multipart form"
        required: false
        type: boolean
        default: true

      content-type:
        description: "Message rendering type"
        required: false
        type: string
        default: "text/plain"

      click-url:
        description: "URL to open when notification is clicked"
        required: false
        type: string
        default: ""

      big-image-url:
        description: "Large notification image"
        required: false
        type: string
        default: ""

      intent-url:
        description: "Android intent URL"
        required: false
        type: string
        default: ""

      extras-json:
        description: "Additional extras JSON merged into generated extras"
        required: false
        type: string
        default: "{}"

      raw-json-payload:
        description: "Completely override generated JSON payload"
        required: false
        type: string
        default: ""

      user-agent:
        description: "HTTP UA string to send with requests"
        required: false
        type: string
        default: "redjax/PipelineTemplates"

    secrets:
      gotify-token:
        required: true

jobs:
  send-notification:
    runs-on: ubuntu-latest

    steps:
      - name: Send Gotify Notification
        shell: bash
        run: |
          set -Eeuo pipefail

          GOTIFY_URL="${{ inputs.gotify-url }}"
          USER_AGENT="${{ inputs.user-agent }}"
          TOKEN="${{ secrets.gotify-token }}"

          TITLE="${{ inputs.title }}"
          MESSAGE="${{ inputs.message }}"
          PRIORITY="${{ inputs.priority }}"

          USE_JSON="${{ inputs.use-json }}"

          CONTENT_TYPE="${{ inputs.content-type }}"
          CLICK_URL="${{ inputs.click-url }}"
          BIG_IMAGE_URL="${{ inputs.big-image-url }}"
          INTENT_URL="${{ inputs.intent-url }}"

          USER_EXTRAS='${{ inputs.extras-json }}'
          RAW_JSON_PAYLOAD='${{ inputs.raw-json-payload }}'

          UA_HEADER=(-H "User-Agent: ${USER_AGENT}")

          echo "[DEBUG] Gotify URL: ${GOTIFY_URL}"

          # -----------------------------
          # Validate JSON inputs safely
          # -----------------------------
          echo "$USER_EXTRAS" | jq empty >/dev/null 2>&1 || {
            echo "ERROR: extras-json invalid JSON"
            exit 1
          }

          if [[ -n "$RAW_JSON_PAYLOAD" ]]; then
            echo "$RAW_JSON_PAYLOAD" | jq empty >/dev/null 2>&1 || {
              echo "ERROR: raw-json-payload invalid JSON"
              exit 1
            }
          fi

          # Normalize priority (avoid jq argjson issues)
          PRIORITY="${PRIORITY:-0}"
          [[ "$PRIORITY" =~ ^[0-9]+$ ]] || PRIORITY=0

          # -----------------------------
          # Multipart mode
          # -----------------------------
          if [[ "$USE_JSON" != "true" ]]; then

            echo "Sending multipart Gotify notification"

            curl \
              --connect-timeout 5 \
              --max-time 15 \
              --fail \
              --silent \
              --show-error \
              --retry 3 \
              --retry-delay 5 \
              -X POST \
              "${GOTIFY_URL}/message?token=${TOKEN}" \
              "${UA_HEADER[@]}" \
              -F "message=${MESSAGE}" \
              ${TITLE:+-F "title=${TITLE}"} \
              ${PRIORITY:+-F "priority=${PRIORITY}"}

            echo "Notification sent successfully"
            exit 0
          fi

          # -----------------------------
          # Build JSON extras
          # -----------------------------
          GENERATED_EXTRAS=$(jq -n '{}')
          
          ## client::display
          if [[ -n "$CONTENT_TYPE" ]]; then
            GENERATED_EXTRAS=$(jq -n \
              --arg ct "$CONTENT_TYPE" \
              '{ "client::display": { "contentType": $ct } }')
          fi

          ## client::notification.click.url
          if [[ -n "$CLICK_URL" ]]; then
            GENERATED_EXTRAS=$(
              echo "$GENERATED_EXTRAS" | jq \
                --arg url "$CLICK_URL" \
                '. + { "client::notification": { "click": { "url": $url } } }'
            )
          fi

          ## client::notification.bigImageUrl
          if [[ -n "$BIG_IMAGE_URL" ]]; then
            GENERATED_EXTRAS=$(
              echo "$GENERATED_EXTRAS" | jq \
                --arg url "$BIG_IMAGE_URL" \
                '. + { "client::notification": { "bigImageUrl": $url } }'
            )
          fi

          ## android::action.onReceive.intentUrl
          if [[ -n "$INTENT_URL" ]]; then
            GENERATED_EXTRAS=$(
              echo "$GENERATED_EXTRAS" | jq \
                --arg url "$INTENT_URL" \
                '. + { "android::action": { "onReceive": { "intentUrl": $url } } }'
            )
          fi

          # Merge extras safely (NO fragile argjson)
          FINAL_EXTRAS=$(
            jq -s 'reduce .[] as $i ({}; . * $i)' \
              <(echo "$GENERATED_EXTRAS") \
              <(echo "$USER_EXTRAS")
          )

          # -----------------------------
          # Build payload safely
          # -----------------------------
          if [[ -n "$RAW_JSON_PAYLOAD" ]]; then
            PAYLOAD="$RAW_JSON_PAYLOAD"
            echo "Using raw payload override"
          else
            PAYLOAD=$(
              jq -n \
                --arg message "$MESSAGE" \
                --arg title "$TITLE" \
                --argjson priority "$PRIORITY" \
                --argjson extras "$FINAL_EXTRAS" \
                '
                { message: $message }

                + (if $title != "" then { title: $title } else {} end)
                + (if $priority > 0 then { priority: $priority } else {} end)
                + (if $extras != {} then { extras: $extras } else {} end)
                '
            )
          fi

          # -----------------------------
          # Final validation BEFORE sending
          # -----------------------------
          echo "Final payload validation:"
          echo "$PAYLOAD" | jq .

          echo "Sending JSON Gotify notification"

          curl \
            --connect-timeout 5 \
            --max-time 15 \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            -X POST \
            "${GOTIFY_URL}/message?token=${TOKEN}" \
            -H "Content-Type: application/json" \
            "${UA_HEADER[@]}" \
            -d "$PAYLOAD"

          echo "Notification sent successfully"
