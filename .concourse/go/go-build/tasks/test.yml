---
platform: linux

image_resource:
  type: registry-image
  source:
    repository: golang
    tag: ((go_version))

inputs:
  - name: app
  - name: pipelinetemplates

run:
  path: /bin/bash
  args:
    - -euo
    - pipefail
    - pipelinetemplates/.concourse/go/go-build/scripts/test.sh

params:
  MODULE_DIR: ((module_dir))