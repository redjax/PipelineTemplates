---
platform: linux

image_resource:
  type: registry-image
  source:
    repository: alpine
    ## https://hub.docker.com/_/alpine
    tag: "3.24"

inputs:
  - name: app
  - name: pipelinetemplates

run:
  path: /bin/sh
  args:
    - -euc
    - pipelinetemplates/.concourse/go/go-build/scripts/publish.sh

params:
  BINARY_NAME: ((binary_name))
  OUTPUT_DIR: ((output_dir))
