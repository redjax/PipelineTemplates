---
platform: linux
image_resource:
  type: registry-image
  source:
    repository: golang
    tag: ((go_version))

inputs:
  - name: app
  - name: pipelinetemplates
outputs:
  - name: output

params:
  MODULE_DIR:
  BUILD_PACKAGE:
  BINARY_NAME:
  PLATFORMS:
  BUILD_TAGS:
  LDFLAGS:
  OUTPUT_DIR:
  CGO_ENABLED:

run:
  path: sh
  args:
    - -ec
    - |
      chmod +x pipelinetemplates/.concourse/go/go-build/build.sh
      pipelinetemplates/.concourse/go/go-build/build.sh
