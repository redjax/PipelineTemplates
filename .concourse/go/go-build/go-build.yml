resources:
  - name: go-image
    type: registry-image
    source:
      repository: golang
      tag: ((go_version))

jobs:
  - name: build-go-app
    public: true
    plan:
      - get: pipelinetemplates
        trigger: true

      - get: app

      - get: go-image

      - task: build
        file: pipelinetemplates/.concourse/go/go-build/build.yml
        vars:
          module_dir: ((module_dir))
          build_package: ((build_package))
          binary_name: ((binary_name))
          platforms: ((platforms))
          build_tags: ((build_tags))
          ldflags: ((ldflags))
          output_dir: ((output_dir))
          cgo_enabled: ((cgo_enabled))
