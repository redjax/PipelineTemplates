---
#################################################################################

# Workflow to run Renovate against a consuming repository.

#

# Supports repositories that define their own renovate.json, and provides a

# default if no config file exists.

#

# Requires a Forgejo Actions secret named RENOVATE_TOKEN, which is a Forgejo

# PAT with the following access:

# - Repository: Read and write

# - Issues: Read and write

# - Pull requests: Read and write

#

#################################################################################

name: Renovate Pipeline

on:
  workflow_call:
    inputs:
      mode:
        description: "Renovate mode: extract, lookup, or run."
        required: false
        type: string
        default: "run"

      repository:
        description: "Target repository to process."
        required: true
        type: string

      log-level:
        description: "Renovate log level."
        required: false
        type: string
        default: "info"

      config-file:
        description: "Path to consuming repo's Renovate JSON config."
        required: false
        type: string
        default: "renovate.json"

      require-config:
        description: "Controls how Renovate handles repo-local config: required, optional, or ignored."
        required: false
        type: string
        default: "optional"

      autodiscover:
        description: "Auto-discover account repositories with Renovate."
        required: false
        type: boolean
        default: false

      # runner-label:
      #   description: "Runner label to use (e.g., forgejo-runner-base, renovate, ubuntu)."
      #   required: false
      #   type: string
      #   default: forgejo-runner-base

      pipelinetemplates-ref:
        description: "Branch, tag, or hash to checkout for PipelineTemplates."
        required: false
        type: string
        default: main

      renovate-author-email:
        description: "Email address to use for Renovate bot."
        required: false
        type: string
        default: "renovate-bot@localhost"

      base-branches:
        description: "Renovate base branches (comma-separated or single branch)."
        required: false
        type: string
        default: ""

      use-base-branch-config:
        description: "Use base branch config for Renovate."
        required: false
        type: boolean
        default: false

      forgejo-endpoint:
        description: "Forgejo API endpoint URL (e.g., https://codeberg.org/api/v1, https://192.168.1.100:3000/api/v1)."
        required: true
        type: string
        default: ""

    secrets:
      renovate-token:
        required: true

      github-com-token:
        required: false

jobs:
  run-renovate:
    runs-on: forgejo-runner-base

    steps:
      - name: Identify image
        run: |
          cat /etc/os-release
          which docker || true
          docker --version || true
          git --version
          ps -p 1 -f

      # - name: "[Debug] Forgejo Runner Environment"
      #   shell: bash
      #   run: |
      #     echo "hostname=$(hostname)"
      #     echo "user=$(id)"
      #     echo "image:"
      #     cat /etc/os-release || true
      #     echo "docker:"
      #     which docker || true
      #     docker version || true

      # - name: "[DEBUG] Renovate token presence"
      #   shell: bash
      #   run: |
      #     if [ -n "${{ secrets.renovate-token }}" ]; then
      #       echo "Token is present"
      #     else
      #       echo "Token is EMPTY"
      #       exit 1
      #     fi

      - name: Validate Forgejo endpoint
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${{ inputs.forgejo-endpoint }}" ]]; then
            echo "[ERROR] forgejo-endpoint input is empty (vars.FJ_ENDPOINT not set?)." >&2
            exit 1
          fi

          if [[ "${{ inputs.forgejo-endpoint }}" != *"/api/v1" ]]; then
            echo "[ERROR] forgejo-endpoint should end with /api/v1, got: ${{ inputs.forgejo-endpoint }}" >&2
            exit 1
          fi

      - name: Checkout consuming repo
        uses: https://github.com/actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Checkout PipelineTemplates"
        uses: https://github.com/actions/checkout@v7
        with:
          repository: redjax/PipelineTemplates
          ref: ${{ inputs.pipelinetemplates-ref }}
          path: pipelinetemplates
          fetch-depth: 0

      - name: Select config file
        id: cfg
        shell: bash
        run: |
          set -Eeuo pipefail

          DEFAULT_CONFIG_FILE="pipelinetemplates/config/renovate/default.json"
          USER_CONFIG_FILE="${{ inputs.config-file }}"

          CONFIG_FILE=""

          if [[ -f "${USER_CONFIG_FILE}" ]]; then
            echo "Using repository Renovate config: ${USER_CONFIG_FILE}"
            cp "${USER_CONFIG_FILE}" renovate-config.json
            CONFIG_FILE="/workspace/renovate-config.json"
          elif [[ -f "${DEFAULT_CONFIG_FILE}" ]]; then
            echo "Using PipelineTemplates default Renovate config"
            cp "${DEFAULT_CONFIG_FILE}" renovate-config.json
            CONFIG_FILE="/workspace/renovate-config.json"
          else
            echo "[ERROR] No Renovate config found."
            echo "Checked:"
            echo "  ${USER_CONFIG_FILE}"
            echo "  ${DEFAULT_CONFIG_FILE}"
            exit 1
          fi

          echo "config-file=${CONFIG_FILE}" >> "$GITHUB_OUTPUT"
          echo "require-config=${{ inputs.require-config }}" >> "$GITHUB_OUTPUT"

          echo "Selected Renovate config:"
          ls -la renovate-config.json

      - name: Decide dry-run mode
        id: mode
        shell: bash
        run: |
          set -Eeuo pipefail

          case "${{ inputs.mode }}" in
            extract)
              echo "dry-run=extract" >> "$GITHUB_OUTPUT"
              ;;
            lookup)
              echo "dry-run=lookup" >> "$GITHUB_OUTPUT"
              ;;
            run)
              echo "dry-run=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "[ERROR] Invalid mode: ${{ inputs.mode }} (use extract, lookup, or run)." >&2
              exit 1
              ;;
          esac

      - name: "[DEBUG] Docker environment"
        shell: bash
        env:
          DOCKER_HOST: tcp://docker-in-docker:2375
          DOCKER_TLS_CERTDIR: ""
        run: |
          set -eux

          echo "Running as: $(id)"
          echo "Docker at: $(which docker)"
          echo "Docker version: $(docker version)"
          echo

          docker info

      - name: Run Renovate
        shell: bash
        env:
          DOCKER_HOST: tcp://docker-in-docker:2375
          DOCKER_TLS_CERTDIR: ""
        run: |
          set -Eeuo pipefail

          CONFIG_FILE="${{ steps.cfg.outputs.config-file }}"

          echo "Renovate config path:"
          echo "${CONFIG_FILE}"

          if [[ ! -f "./renovate-config.json" ]]; then
            echo "[ERROR] Renovate config file does not exist inside runner workspace:"
            ls -la
            exit 1
          fi

          docker run --rm \
            -e RENOVATE_PLATFORM=gitea \
            -e RENOVATE_ENDPOINT="${{ inputs.forgejo-endpoint }}" \
            -e RENOVATE_TOKEN="${{ secrets.renovate-token }}" \
            -e RENOVATE_REPOSITORIES="${{ inputs.repository }}" \
            -e LOG_LEVEL="${{ inputs.log-level }}" \
            -e RENOVATE_CONFIG_FILE="${CONFIG_FILE}" \
            -e RENOVATE_REQUIRE_CONFIG="${{ steps.cfg.outputs.require-config }}" \
            -e RENOVATE_DRY_RUN="${{ steps.mode.outputs.dry-run }}" \
            -e RENOVATE_AUTODISCOVER="${{ inputs.autodiscover }}" \
            -e RENOVATE_BASE_BRANCHES="${{ inputs.base-branches }}" \
            -e RENOVATE_USE_BASE_BRANCH_CONFIG="${{ inputs.use-base-branch-config }}" \
            -e RENOVATE_GIT_AUTHOR="Renovate Bot <${{ inputs.renovate-author-email }}>" \
            -e GITHUB_COM_TOKEN="${{ secrets.github-com-token }}" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            ghcr.io/renovatebot/renovate:latest
