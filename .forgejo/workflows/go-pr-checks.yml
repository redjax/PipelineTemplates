---
---
############################################
# Call from a consuming repository to do a #
# test app build.                          #
############################################

name: Go PR Checks

on:
  workflow_call:
    inputs:
      module-dir:
        description: Path to the Go module root.
        required: false
        type: string
        default: "."

      build-package:
        description: Go package path to build.
        required: true
        type: string

      binary-name:
        description: Name for the built binary.
        required: true
        type: string

      go-version:
        description: Go toolchain version to install.
        required: false
        type: string
        default: "1.25.6"

      platforms:
        description: Comma-separated GOOS/GOARCH targets.
        required: false
        type: string
        default: "linux/amd64"

      build-tags:
        description: Optional Go build tags.
        required: false
        type: string
        default: ""

      ldflags:
        description: Optional ldflags passed to go build.
        required: false
        type: string
        default: ""

      output-dir:
        description: Directory to write build artifacts to.
        required: false
        type: string
        default: "dist"

      artifact-name:
        description: Artifact name to upload. If empty, a default is derived.
        required: false
        type: string
        default: ""

      upload-artifacts:
        description: Upload build artifacts.
        required: false
        type: boolean
        default: true

      enable-cache:
        description: Enable Go module/build caching.
        required: false
        type: boolean
        default: true

      base-sha:
        description: Base SHA for the PR diff.
        required: true
        type: string

      head-sha:
        description: Head SHA for the PR diff.
        required: true
        type: string

      change-paths:
        description: JSON array of glob patterns used to detect changed files.
        required: false
        type: string
        default: '["go.mod","go.sum","cmd/**","internal/**"]'

    outputs:
      changes_detected:
        description: Whether watched paths changed.
        value: ${{ jobs.detect.outputs.changes_detected }}

jobs:
  detect:
    runs-on: forgejo-runner-base
    outputs:
      changes_detected: ${{ steps.filter.outputs.changes_detected }}

    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v7

      - name: Detect changes
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ inputs.base-sha }}
          HEAD_SHA: ${{ inputs.head-sha }}
          CHANGE_PATHS: ${{ inputs.change-paths }}
        run: |
          changed=false

          ## Handle new branches, 0+ commits
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "Base SHA is empty branch creation commit; using repository root commit"
            BASE_SHA=$(git rev-list --max-parents=0 HEAD)
          fi

          ## Validate change_paths input
          if ! echo "$CHANGE_PATHS" | jq empty; then
            echo "change-paths must be valid JSON"
            exit 1
          fi

          ## Convert JSON list to Bash array
          mapfile -t patterns < <(echo "$CHANGE_PATHS" | jq -r '.[]')

          while IFS= read -r file; do
            for pattern in "${patterns[@]}"; do
              if [[ "$file" == $pattern ]]; then
                changed=true
                break 2
              fi
            done
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          echo "Detected changes: $changed"

          echo "changes_detected=$changed" >> "$GITHUB_OUTPUT"

  build-preview:
    needs: detect
    if: needs.detect.outputs.changes_detected == 'true'
    runs-on: forgejo-runner-base

    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v7

      - name: Build snapshot
        uses: redjax/pipelinetemplates/.forgejo/actions/go-build@feat/forgejo-go-pr-checks
        with:
          module-dir: ${{ inputs.module-dir }}
          build-package: ${{ inputs.build-package }}
          binary-name: ${{ inputs.binary-name }}
          platforms: ${{ inputs.platforms }}
          build-tags: ${{ inputs.build-tags }}
          ldflags: ${{ inputs.ldflags }}
          output-dir: ${{ inputs.output-dir }}
          go-version: ${{ inputs.go-version }}
          artifact-name: ${{ inputs.artifact-name }}
          upload-artifacts: ${{ inputs.upload-artifacts }}
          enable-cache: ${{ inputs.enable-cache }}
