---
name: Go Version Bump

on:
  workflow_call:
    inputs:
      bump-type:
        description: "Version bump type: auto, major, minor, patch."
        required: false
        type: string
        default: "auto"

      version-file:
        description: "Version file path."
        required: false
        type: string
        default: ".version"

      bumpversion-config:
        description: "bump-my-version configuration file path."
        required: false
        type: string
        default: ".bumpversion.toml"

      base-branch:
        description: "Base branch."
        required: false
        type: string
        default: "main"

      forgejo-endpoint:
        description: "Forgejo API endpoint, ending in /api/v1."
        required: true
        type: string

      repository:
        description: "Repository owner/name."
        required: true
        type: string

    secrets:
      FJ_TOKEN:
        required: true

jobs:
  bump:
    runs-on: forgejo-go-base

    steps:
      - name: Checkout base branch
        uses: https://github.com/actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.base-branch }}

      - name: Bump version
        id: version
        uses: https://github.com/redjax/PipelineTemplates/.forgejo/actions/bump-version@feat/forgejo-go-release-pipelines
        with:
          bump-type: ${{ inputs.bump-type }}
          version-file: ${{ inputs.version-file }}
          bumpversion-config: ${{ inputs.bumpversion-config }}

      - name: Create version bump PR
        id: pr
        uses: https://github.com/redjax/PipelineTemplates/.forgejo/actions/create-version-pr@feat/forgejo-go-release-pipelines
        with:
          version: ${{ steps.version.outputs.new-version }}
          version-file: ${{ inputs.version-file }}
          bumpversion-config: ${{ inputs.bumpversion-config }}
          base-branch: ${{ inputs.base-branch }}
          forgejo-endpoint: ${{ inputs.forgejo-endpoint }}
          repository: ${{ inputs.repository }}
          token: ${{ secrets.FJ_TOKEN }}

      - name: Version bump summary
        shell: bash
        run: |
          {
            echo "## Version bump PR"
            echo
            echo "- Previous version: \`${{ steps.version.outputs.current-version }}\`"
            echo "- New version: \`${{ steps.version.outputs.new-version }}\`"
            echo "- Bump type: \`${{ steps.version.outputs.bump-type }}\`"
            echo "- Branch: \`${{ steps.pr.outputs.branch }}\`"
            echo "- Pull request: #${{ steps.pr.outputs.pr-number }}"
          } >> "${FORGEJO_STEP_SUMMARY}"
