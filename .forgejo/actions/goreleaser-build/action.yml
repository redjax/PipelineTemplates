---
name: "GoReleaser Build"
description: "Build and release Go apps using GoReleaser (snapshot or release)."

inputs:
  go-version:
    description: "Go version used for the build"
    required: false
    default: ""

  goreleaser-config:
    description: "Path to .goreleaser.yml config file (default: .goreleaser.yml)"
    required: false
    default: ".goreleaser.yml"

  snapshot:
    description: "Build snapshot (no release/publish). Use for non-release branches."
    required: false
    default: "false"

  clean:
    description: "Remove dist directory before building"
    required: false
    default: "true"

  skip-validate:
    description: "Skip validation checks"
    required: false
    default: "false"

  skip-publish:
    description: "Skip publishing artifacts (build only)"
    required: false
    default: "false"

  goreleaser-version:
    description: "GoReleaser version to use (default: latest)"
    required: false
    default: "latest"

  working-directory:
    description: "Working directory for the build (default: .)"
    required: false
    default: "."

  docker-build:
    description: "Enable Docker image building (if configured in .goreleaser.yml)"
    required: false
    default: "false"

  extra-args:
    description: "Additional GoReleaser CLI arguments (space-separated)"
    required: false
    default: ""

  dry-run:
    description: "Perform dry-run (validate config without building)"
    required: false
    default: "false"

  release-notes:
    description: "Path to custom release notes file"
    required: false
    default: ""

  artifact-name:
    description: "Name for uploaded artifacts (default: <repo-name>-dist or <repo-name>-snapshot-dist)"
    required: false
    default: ""

  upload-artifacts:
    description: "Upload build artifacts"
    required: false
    default: "true"

  github-token:
    description: "Token for creating releases (defaults to GITHUB_TOKEN)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Checkout caller repo
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Fetch all tags
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: git fetch --force --tags

    - name: Install GoReleaser
      shell: bash
      env:
        GORELEASER_VERSION: ${{ inputs.goreleaser-version }}
      run: |
        set -euo pipefail

        if command -v goreleaser >/dev/null 2>&1; then
          echo "GoReleaser already available:"
          goreleaser --version
          exit 0
        fi

        case "$(uname -m)" in
          x86_64)
            GORELEASER_ARCH="x86_64"
            ;;
          aarch64|arm64)
            GORELEASER_ARCH="arm64"
            ;;
          *)
            echo "Unsupported architecture: $(uname -m)"
            exit 1
            ;;
        esac

        if [[ "${GORELEASER_VERSION}" == "latest" ]]; then
          version="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/goreleaser/goreleaser/releases" \
              | jq -r '
                  map(select(.prerelease == false and .draft == false))
                  | sort_by(.published_at)
                  | reverse
                  | .[0].tag_name
                '
          )"
        else
          version="v${GORELEASER_VERSION#v}"
        fi

        echo "Installing GoReleaser ${version}"

        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT

        echo "Downloading GoReleaser:"
        echo "https://github.com/goreleaser/goreleaser/releases/download/${version}/goreleaser_Linux_${GORELEASER_ARCH}.tar.gz"

        curl -fsSL \
          -o "${tmp}/goreleaser.tar.gz" \
          "https://github.com/goreleaser/goreleaser/releases/download/${version}/goreleaser_Linux_${GORELEASER_ARCH}.tar.gz"

        tar -xzf "${tmp}/goreleaser.tar.gz" -C "${tmp}"

        mkdir -p "${HOME}/bin"
        mv "${tmp}/goreleaser" "${HOME}/bin/goreleaser"

        echo "${HOME}/bin" >> "${GITHUB_PATH}"

        echo "Installed:"
        "${HOME}/bin/goreleaser" --version

    - name: Verify tools
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "Go:"
        go version

        echo
        echo "GoReleaser:"
        goreleaser --version

    - name: Verify GoReleaser config
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [[ ! -f "${{ inputs.goreleaser-config }}" ]]; then
          echo "GoReleaser config not found:"
          echo "  ${{ inputs.working-directory }}/${{ inputs.goreleaser-config }}"
          exit 1
        fi

        echo "Using GoReleaser config:"
        echo "  ${{ inputs.goreleaser-config }}"

    - name: Docker Login (if Docker build enabled)
      if: ${{ inputs.docker-build == 'true' }}
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token || env.GITHUB_TOKEN }}
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Setup QEMU (for cross-platform Docker builds)
      if: ${{ inputs.docker-build == 'true' }}
      uses: docker/setup-qemu-action@v4

    - name: Setup Docker Buildx (for cross-platform Docker builds)
      if: ${{ inputs.docker-build == 'true' }}
      uses: docker/setup-buildx-action@v4

    - name: Build GoReleaser args
      id: goreleaser-args
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CLEAN: ${{ inputs.clean }}
        SNAPSHOT: ${{ inputs.snapshot }}
        SKIP_VALIDATE: ${{ inputs.skip-validate }}
        SKIP_PUBLISH: ${{ inputs.skip-publish }}
        RELEASE_NOTES: ${{ inputs.release-notes }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
      run: |
        bash "${{ github.action_path }}/scripts/build-args.sh"

    - name: Run GoReleaser
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
      run: |
        goreleaser ${{ steps.goreleaser-args.outputs.args }} --config=${{ inputs.goreleaser-config }}

    - name: Determine artifact name
      if: ${{ inputs.snapshot == 'true' || inputs.skip-publish == 'true' }}
      id: artifact-name
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [[ -n "${{ inputs.artifact-name }}" ]]; then
          ARTIFACT_NAME="${{ inputs.artifact-name }}"
        else
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          if [[ "${{ inputs.snapshot }}" == "true" ]]; then
            ARTIFACT_NAME="${REPO_NAME}-snapshot-dist"
          else
            ARTIFACT_NAME="${REPO_NAME}-dist"
          fi
        fi
        echo "name=$ARTIFACT_NAME" >> "$FORGEJO_OUTPUT"
        echo "Artifact will be named: $ARTIFACT_NAME"

    - name: Upload artifacts
      if: ${{ inputs.upload-artifacts == 'true' && (inputs.snapshot == 'true' || inputs.skip-publish == 'true') }}
      uses: forgejo/upload-artifact@v3
      with:
        name: ${{ steps.artifact-name.outputs.name }}
        path: ${{ inputs.working-directory }}/dist/
        retention-days: 7
        if-no-files-found: warn

    - name: "[DEBUG] Check GoReleaser action"
      shell: bash
      run: |
        pwd
        find pipelinetemplates/.forgejo/actions -maxdepth 3 -type f | sort | grep goreleaser || true

        echo "---"
        ls -la pipelinetemplates/.forgejo/actions/goreleaser-build || true

        echo "---"
        ls -la pipelinetemplates/.forgejo/actions/goreleaser-build/scripts || true

    - name: Generate build summary
      if: always()
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GORELEASER_CONFIG: ${{ inputs.goreleaser-config }}
        SNAPSHOT: ${{ inputs.snapshot }}
        GO_VERSION: ${{ inputs.go-version }}
        GORELEASER_VERSION: ${{ inputs.goreleaser-version }}
      run: |
        echo "github.action_path=${{ github.action_path }}"

        ls -la "${{ github.action_path }}"
        ls -la "${{ github.action_path }}/scripts"

        bash "${{ github.action_path }}/scripts/summary.sh"
