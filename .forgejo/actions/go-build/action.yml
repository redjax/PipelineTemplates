---
name: "Go Build"
description: "Build a Go application and optionally upload artifacts"

inputs:
  module-dir:
    description: "Path to the Go module root (directory containing go.mod)."
    required: false
    default: "."
  build-package:
    description: "Go package path to build relative to module-dir. Examples: ., ./cmd/api"
    required: true
  binary-name:
    description: "Name for binary file."
    required: true
  platforms:
    description: "Comma-separated list of GOOS/GOARCH targets."
    required: false
    default: "linux/amd64"
  build-tags:
    description: "Optional Go build tags."
    required: false
    default: ""
  ldflags:
    description: "Optional ldflags passed to go build."
    required: false
    default: ""
  output-dir:
    description: "Directory to write build artifacts to relative to module-dir."
    required: false
    default: "dist"
  artifact-name:
    description: "Name for uploaded artifacts. If empty, derived automatically."
    required: false
    default: ""
  upload-artifacts:
    description: "Upload build artifacts."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Verify Go installation
      shell: bash
      run: |
        set -euo pipefail

        echo "Go version:"
        go version

        echo
        echo "Go environment:"
        go env GOROOT GOPATH

    - name: Build
      shell: bash
      env:
        MODULE_DIR: ${{ inputs.module-dir }}
        BUILD_PACKAGE: ${{ inputs.build-package }}
        BINARY_NAME: ${{ inputs.binary-name }}
        PLATFORMS: ${{ inputs.platforms }}
        BUILD_TAGS: ${{ inputs.build-tags }}
        LDFLAGS: ${{ inputs.ldflags }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        bash "${{ github.action_path }}/go-build.sh"

    - name: Determine artifact name
      if: ${{ inputs.upload-artifacts == 'true' }}
      id: artifact-name
      shell: bash
      run: |
        if [[ -n "${{ inputs.artifact-name }}" ]]; then
          artifact_name="${{ inputs.artifact-name }}"
        else
          repo_name="${GITHUB_REPOSITORY##*/}"
          artifact_name="${repo_name}-${{ inputs.binary-name }}-dist"
        fi

        echo "name=${artifact_name}" >> "$GITHUB_OUTPUT"

        echo "Artifact name: ${artifact_name}"

    - name: Upload artifacts
      if: ${{ inputs.upload-artifacts == 'true' }}
      uses: actions/upload-artifact@v3
      with:
        name: ${{ steps.artifact-name.outputs.name }}
        path: |
          ${{ inputs.module-dir }}/${{ inputs.output-dir }}/
        retention-days: 7
        if-no-files-found: warn
